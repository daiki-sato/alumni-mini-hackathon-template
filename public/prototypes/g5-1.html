<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="claude:viewport-fit-sides" content="cover">
<title>ナヅケル</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@500;700&family=Noto+Sans+JP:wght@400;500;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
:root{
  --bg:#F1F3EF; --surface:#FFFFFF; --ink:#1A2320; --muted:#5E6B66; --line:#D9DED9;
  --signal:#E3A008; --signal-ink:#5A3E00; --ok:#2F7D6D; --ng:#C8512F; --board:#1F2A26; --board-ink:#F6C343;
  --font-display:"Zen Kaku Gothic New","Hiragino Sans","Noto Sans JP",sans-serif;
  --font-body:"Noto Sans JP","Hiragino Sans",sans-serif;
  --font-mono:"IBM Plex Mono",ui-monospace,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#111614; --surface:#1A201D; --ink:#E6ECE8; --muted:#9AA7A1; --line:#2C3531;
  --signal:#F2B632; --signal-ink:#2A1D00; --ok:#5FB8A3; --ng:#EE7C5A; --board:#0B0F0D; --board-ink:#F6C343; color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#111614; --surface:#1A201D; --ink:#E6ECE8; --muted:#9AA7A1; --line:#2C3531;
  --signal:#F2B632; --signal-ink:#2A1D00; --ok:#5FB8A3; --ng:#EE7C5A; --board:#0B0F0D; --board-ink:#F6C343; color-scheme:dark;}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);margin:0;font-size:15px;line-height:1.6}
.outer{padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));padding-top:12px;padding-bottom:48px}
.wrap{max-width:560px;margin:0 auto}
.top{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px}
.back{color:var(--muted);font-size:14px;text-decoration:none;padding:8px 0;display:inline-block}
.back:hover{text-decoration:underline}
.tag{font:500 11px var(--font-mono);border:1px solid var(--line);color:var(--muted);padding:2px 6px;border-radius:4px}
.hyp{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:10px 12px;font-size:12px;line-height:1.6;color:var(--muted);margin-bottom:18px}
.hyp dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:3px 10px}
.hyp dt{font-weight:700;color:var(--ink);white-space:nowrap}
.hyp dd{margin:0}
.hyp .k-ok{color:var(--ok);font-weight:700}
.hyp .k-ng{color:var(--ng);font-weight:700}
h1{font-family:var(--font-display);font-size:28px;line-height:1.25;margin:0 0 4px;letter-spacing:.01em}
h2{font-family:var(--font-display);font-size:16px;margin:24px 0 8px}
.lead{margin:0 0 14px;color:var(--muted);font-size:14px}
.note{color:var(--muted);font-size:12px;margin:6px 0 0}
.board{background:var(--board);color:var(--board-ink);border-radius:8px;padding:14px 16px;display:flex;align-items:flex-end;justify-content:space-between;gap:14px;flex-wrap:wrap}
.board .lbl{font-size:12px;color:var(--board-ink);opacity:.85;line-height:1.4}
.board .big{font:600 46px/1.05 var(--font-mono);font-variant-numeric:tabular-nums;letter-spacing:.02em;color:var(--board-ink)}
.board .mid{font:600 28px/1.1 var(--font-mono);font-variant-numeric:tabular-nums;color:var(--board-ink)}
.board .unit{font:500 14px var(--font-mono);margin-left:4px}
.btn{font:700 15px var(--font-body);min-height:44px;padding:8px 14px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--signal);color:var(--signal-ink);border-color:var(--signal)}
.btn.ghost{background:transparent}
.btn.small{min-height:36px;font-size:13px;padding:4px 10px;font-weight:500}
.btn[aria-pressed="true"]{background:var(--board);color:var(--board-ink);border-color:var(--board)}
.btn:disabled{opacity:.5;cursor:default}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.numrow{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
.numrow .btn{padding:4px 0;font-family:var(--font-mono);font-size:17px;font-variant-numeric:tabular-nums}
input[type=text]{font:400 16px var(--font-body);width:100%;min-height:44px;padding:8px 10px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.panel{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:12px}
.list{list-style:none;margin:0;padding:0}
.list li{padding:8px 0;border-top:1px solid var(--line);display:flex;justify-content:space-between;gap:10px;align-items:baseline;font-size:14px}
.list li:first-child{border-top:none}
.mono{font-family:var(--font-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.bar{height:8px;border-radius:4px;background:var(--line);overflow:hidden}
.bar>i{display:block;height:100%;background:var(--ink)}
.status{min-height:22px;font-size:13px;color:var(--muted);margin:8px 0 0}
.sample-bar{margin-top:32px;border-top:1px solid var(--line);padding-top:12px;font-size:12px;color:var(--muted)}
.sample-bar .btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.confirm{margin-top:10px;border:1px solid var(--ng);border-radius:8px;padding:10px 12px;background:var(--surface);color:var(--ink);font-size:13px}
.confirm[hidden]{display:none}
.confirm .btns{margin-top:8px}
button:focus-visible,input:focus-visible,a:focus-visible{outline:3px solid var(--signal);outline-offset:2px}
@media (prefers-reduced-motion: reduce){*{animation:none !important;transition:none !important}}

.pending{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:12px;margin-bottom:10px}
.pending .hd{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px;font-size:14px}
.sec-note{font-size:12px;color:var(--muted);margin:0 0 8px}
.drop{font-family:var(--font-mono);font-variant-numeric:tabular-nums;font-weight:600}
.bars li{display:block}
.bars .t{display:flex;justify-content:space-between;margin-bottom:4px}
.pair{font-family:var(--font-mono);font-variant-numeric:tabular-nums}
.cmp{display:flex;gap:18px;flex-wrap:wrap}
</style>
</head>
<body>
<div class="outer"><div class="wrap">
<div class="top"><a class="back" href="./">← 50の仮説</a><span class="tag" id="sample-tag">サンプル</span></div>
<div class="hyp" aria-label="仮説カード"><dl>
<dt>視点</dt><dd>認知・感情</dd>
<dt>種類</dt><dd>抽象</dd>
<dt>仮説</dt><dd>感情に名前をつけるだけで、その強さが下がる（感情のラベリング）。</dd>
<dt>確かめること</dt><dd><span class="k-ok">当たり</span>＝名前をつけた後の強さが下がる<br><span class="k-ng">外れ</span>＝名前をつけても変わらない</dd>
</dl></div>
<h1>ナヅケル</h1>
<p class="lead">いまの気持ちに名前をつけて、強さを数字にする。あとでもう一度、強さだけ聞く。</p>

<div class="board" aria-live="polite">
  <div><div class="lbl">名前をつけた記録の<br>強さの下がり幅（平均）</div><div class="big" id="b-named">–</div></div>
  <div><div class="lbl">名前なしの記録</div><div class="mid" id="b-none">–</div></div>
</div>
<p class="note" id="b-note"></p>

<h2>1. いまの気持ちの名前</h2>
<div class="chips" id="names" role="group" aria-label="気持ちの名前"></div>
<h2>2. その強さ（0〜10）をタップ</h2>
<div class="numrow" id="num-before" role="group" aria-label="いまの強さ"></div>
<p class="status" id="status" role="status"></p>

<h2>もう一度、強さだけ</h2>
<p class="sec-note">本番では数分たってから聞く。デモではすぐ答えられる。</p>
<div id="pending"></div>

<h2>名前ごとの下がり幅</h2>
<ul class="list bars" id="by-name"></ul>

<h2>記録</h2>
<ul class="list" id="history"></ul>
<div class="sample-bar"><span id="sample-label"></span>
<div class="btns"><button type="button" class="btn small ghost" id="btn-clear">サンプルを消して自分で使う</button><button type="button" class="btn small ghost" id="btn-reset">サンプルに戻す</button></div>
<div class="confirm" id="confirm" hidden role="alertdialog" aria-live="assertive"><div id="confirm-msg"></div><div class="btns row"><button type="button" class="btn small" id="confirm-yes">はい</button><button type="button" class="btn small ghost" id="confirm-no">やめる</button></div></div>
</div>
</div></div>
<script>
(function(){
'use strict';
var KEY='hack3-g5-1-v1';
var state=null;
function $(id){return document.getElementById(id)}
function esc(s){return String(s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function loadState(){
  try{var s=localStorage.getItem(KEY);if(s){var o=JSON.parse(s);if(o&&o.v===1)return o}}catch(e){}
  return makeSample();
}
function save(){try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){}}
function ask(msg,yes){
  var box=$('confirm');
  $('confirm-msg').textContent=msg;
  box.hidden=false;
  $('confirm-yes').onclick=function(){box.hidden=true;yes()};
  $('confirm-no').onclick=function(){box.hidden=true};
}
function renderBar(){
  var on=!!state.sample;
  $('sample-tag').hidden=!on;
  $('sample-label').textContent=on?'いま見えているのはサンプルのデータです。':'いま見えているのは自分のデータです（この端末の中だけ）。';
  $('btn-clear').disabled=!on;
}
function bindCommon(){
  $('btn-clear').addEventListener('click',function(){
    ask('サンプルを消して、空の状態から始めます。よいですか。',function(){state=makeEmpty();save();render();renderBar()});
  });
  $('btn-reset').addEventListener('click',function(){
    ask('いまのデータを消して、サンプルに戻します。よいですか。',function(){state=makeSample();save();render();renderBar()});
  });
}
function boot(){
  state=loadState();
  bindCommon();
  if(typeof initProduct==='function')initProduct();
  render();
  renderBar();
}

var NAMES=['無理','イライラ','ムズムズ','不安','平気'];
var NONE='名前をつけない';
var sel=NONE;
function ago(t){var m=Math.max(0,Math.round((Date.now()-t)/60000));return m<1?'いま':m<60?m+'分前':Math.round(m/60)+'時間前'}
function makeSample(){
  var now=Date.now(),M=60000;
  var rows=[['ムズムズ',7,4,300],['無理',8,6,260],['イライラ',6,3,220],['不安',5,3,200],['平気',3,3,180],['無理',9,7,150],
    [NONE,7,7,120],[NONE,8,7,100],[NONE,6,6,80],[NONE,7,5,60]];
  var recs=rows.map(function(r,i){return {id:i+1,name:r[0],before:r[1],after:r[2],t:now-r[3]*M}});
  recs.push({id:11,name:'イライラ',before:6,after:null,t:now-3*M});
  return {v:1,sample:true,recs:recs,seq:12};
}
function makeEmpty(){return {v:1,sample:false,recs:[],seq:1}}
function avg(a){if(!a.length)return null;var s=0;a.forEach(function(x){s+=x});return s/a.length}
function fmt(x){
  if(x==null)return '–';
  var r=Math.round(x*10)/10;
  if(r>0)return '−'+r.toFixed(1);
  if(r<0)return '+'+Math.abs(r).toFixed(1);
  return '0.0';
}
function numRow(act,extra){
  var h='';
  for(var i=0;i<=10;i++)h+='<button type="button" class="btn" data-act="'+act+'" data-v="'+i+'"'+(extra||'')+'>'+i+'</button>';
  return h;
}
function renderNames(){
  var h='';
  NAMES.concat([NONE]).forEach(function(n){
    h+='<button type="button" class="btn" data-act="name" data-n="'+esc(n)+'" aria-pressed="'+(sel===n)+'">'+esc(n)+'</button>';
  });
  $('names').innerHTML=h;
}
function render(){
  renderNames();
  $('num-before').innerHTML=numRow('before');
  var named=[],none=[],byName={};
  state.recs.forEach(function(r){
    if(r.after==null)return;
    var d=r.before-r.after;
    if(r.name===NONE)none.push(d);else{named.push(d);(byName[r.name]=byName[r.name]||[]).push(d)}
  });
  $('b-named').textContent=fmt(avg(named));
  $('b-none').textContent=fmt(avg(none));
  $('b-note').textContent=named.length||none.length?
    '名前あり '+named.length+'件・名前なし '+none.length+'件の平均（−は強さが下がった）。件数が少ないうちは参考値。':'まだ、答えまでそろった記録がない。';
  var p='',pend=state.recs.filter(function(r){return r.after==null});
  pend.slice().reverse().forEach(function(r){
    p+='<div class="pending"><div class="hd"><span>'+esc(r.name)+'　<span class="pair">'+r.before+'</span></span><span class="muted">'+ago(r.t)+'</span></div>'
      +'<div class="numrow" role="group" aria-label="'+esc(r.name)+'のいまの強さ">'+numRow('after',' data-id="'+r.id+'"')+'</div></div>';
  });
  $('pending').innerHTML=p||'<p class="note">待っている記録はない。</p>';
  var b='';
  NAMES.forEach(function(n){
    var a=byName[n];if(!a)return;
    var m=avg(a);
    b+='<li><div style="flex:1"><div class="t"><span>'+esc(n)+'</span><span class="drop">'+fmt(m)+' <span class="muted">n='+a.length+'</span></span></div>'
      +'<div class="bar"><i style="width:'+Math.max(0,Math.min(100,m*10))+'%"></i></div></div></li>';
  });
  $('by-name').innerHTML=b||'<li class="muted">まだない</li>';
  var h='';
  state.recs.slice().reverse().forEach(function(r){
    h+='<li><span>'+esc(r.name)+'</span><span class="pair">'+r.before+' → '+(r.after==null?'?':r.after)+'</span><span class="muted">'+ago(r.t)+'</span></li>';
  });
  $('history').innerHTML=h||'<li class="muted">まだない</li>';
}
function initProduct(){
  document.addEventListener('click',function(e){
    var t=e.target&&e.target.closest?e.target.closest('[data-act]'):null;
    if(!t)return;
    var a=t.getAttribute('data-act');
    if(a==='name'){sel=t.getAttribute('data-n');renderNames();return}
    var v=parseInt(t.getAttribute('data-v'),10);
    if(a==='before'){
      state.recs.push({id:state.seq++,name:sel,before:v,after:null,t:Date.now()});
      $('status').textContent='記録した: '+sel+'　'+v+'。あとで強さだけ聞く。';
      sel=NONE;save();render();
    }else if(a==='after'){
      var id=parseInt(t.getAttribute('data-id'),10);
      state.recs.forEach(function(r){if(r.id===id)r.after=v});
      save();render();
    }
  });
}

boot();
})();
</script>
</body>
</html>
