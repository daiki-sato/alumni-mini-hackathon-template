<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="claude:viewport-fit-sides" content="cover">
<title>コエカケタイミング</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@500;700&family=Noto+Sans+JP:wght@400;500;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
:root{
  --bg:#F1F3EF; --surface:#FFFFFF; --ink:#1A2320; --muted:#5E6B66; --line:#D9DED9;
  --signal:#E3A008; --signal-ink:#5A3E00; --ok:#2F7D6D; --ng:#C8512F; --board:#1F2A26; --board-ink:#F6C343;
  --font-display:"Zen Kaku Gothic New","Hiragino Sans","Noto Sans JP",sans-serif;
  --font-body:"Noto Sans JP","Hiragino Sans",sans-serif;
  --font-mono:"IBM Plex Mono",ui-monospace,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#111614; --surface:#1A201D; --ink:#E6ECE8; --muted:#9AA7A1; --line:#2C3531;
  --signal:#F2B632; --signal-ink:#2A1D00; --ok:#5FB8A3; --ng:#EE7C5A; --board:#0B0F0D; --board-ink:#F6C343; color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#111614; --surface:#1A201D; --ink:#E6ECE8; --muted:#9AA7A1; --line:#2C3531;
  --signal:#F2B632; --signal-ink:#2A1D00; --ok:#5FB8A3; --ng:#EE7C5A; --board:#0B0F0D; --board-ink:#F6C343; color-scheme:dark;}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);margin:0;font-size:15px;line-height:1.6}
.wrap{max-width:560px;margin:0 auto;padding-top:12px;padding-bottom:56px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.back{display:inline-block;color:var(--muted);font-size:13px;text-decoration:none;padding:4px 0}
.back:hover{text-decoration:underline}
h1{font-family:var(--font-display);font-size:26px;margin:4px 0 10px;letter-spacing:.02em}
h2{font-family:var(--font-display);font-size:17px;margin:0 0 8px}
h3{font-family:var(--font-display);font-size:15px;margin:0 0 6px}
p{margin:0 0 8px}
.note{font-size:12px;color:var(--muted);margin:4px 0}
.hypo{border:1px solid var(--line);border-left:4px solid var(--signal);border-radius:8px;background:var(--surface);padding:8px 12px;margin-bottom:12px;font-size:12.5px}
.hypo dl{margin:0}.hypo dl>div{display:flex;gap:10px;padding:2px 0}
.hypo dt{flex:0 0 5.4em;color:var(--muted);font-weight:500}.hypo dd{margin:0}
.hypo .hit{color:var(--ok)}.hypo .miss{color:var(--ng)}
.samplebar{border:1px dashed var(--line);border-radius:8px;padding:8px 12px;margin-bottom:14px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.btn{font:inherit;font-weight:500;font-size:14px;border:1px solid var(--ink);background:var(--surface);color:var(--ink);border-radius:8px;padding:9px 14px;min-height:44px;cursor:pointer}
.btn:hover{background:var(--bg)}
.btn.primary{background:var(--signal);border-color:var(--signal);color:var(--signal-ink);font-weight:700}
.btn.ghost{border-color:var(--line);color:var(--muted);font-size:12.5px;min-height:38px;padding:6px 10px}
.btn[aria-pressed="true"],.btn.on{background:var(--ink);color:var(--surface)}
.btn:focus-visible,input:focus-visible,select:focus-visible,summary:focus-visible,a:focus-visible{outline:3px solid var(--signal);outline-offset:2px}
.confirm{margin-top:8px;padding:8px 10px;background:var(--bg);border-radius:8px;font-size:13px}
.board{background:var(--board);color:var(--board-ink);border-radius:8px;padding:14px 16px;margin:12px 0}
.board .lab{font-size:12.5px;opacity:.85}
.board .big{font-family:var(--font-mono);font-variant-numeric:tabular-nums;font-weight:600;font-size:40px;line-height:1.15;letter-spacing:.01em}
.board .big small{font-size:16px;margin-left:4px}
.board .sub{font-size:12px;opacity:.8;margin-top:2px}
.board .cols{display:flex;gap:20px;flex-wrap:wrap}
section.blk{border-top:1px solid var(--line);padding:14px 0}
.feel{border-top:1px solid var(--line);padding:14px 0;margin-top:16px}
.mono{font-family:var(--font-mono);font-variant-numeric:tabular-nums}
label{font-size:13px}
input[type=number],input[type=text],select{font:inherit;font-size:14px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink);padding:6px 8px;min-height:40px;max-width:100%}
input[type=range]{width:100%;accent-color:var(--signal)}
.sl{display:grid;grid-template-columns:1fr auto;gap:2px 8px;align-items:center;margin:8px 0}
.sl .v{font-family:var(--font-mono);font-variant-numeric:tabular-nums;font-weight:600}
.sl input{grid-column:1/3}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{text-align:left;padding:5px 4px;border-bottom:1px solid var(--line);font-weight:500}
.tag{display:inline-block;font-size:11px;border:1px solid var(--line);border-radius:6px;padding:0 6px;color:var(--muted)}
.tag.ok{color:var(--ok);border-color:var(--ok)}.tag.ng{color:var(--ng);border-color:var(--ng)}
details{margin:8px 0}summary{cursor:pointer;font-size:13px;color:var(--muted);min-height:32px}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important;scroll-behavior:auto!important}}


.spark{width:100%;height:auto;display:block;background:var(--surface);border:1px solid var(--line);border-radius:8px}
.spark .ln{fill:none;stroke:var(--ink);stroke-width:1.6}
.spark .th{stroke:var(--ng);stroke-dasharray:4 3;stroke-width:1}
.spark .vc{fill:var(--signal);stroke:var(--signal-ink);stroke-width:1}
.spark text{fill:var(--muted);font-size:9px;font-family:var(--font-mono)}
.alert{border:2px solid var(--signal);border-radius:8px;background:var(--surface);padding:10px 12px;margin:8px 0}
.alert .ty{font-family:var(--font-display);font-weight:700}
.alert .say{margin:6px 0;padding:8px 10px;background:var(--bg);border-radius:8px;font-size:14px}
.alert .at{font-family:var(--font-mono);font-size:12px;color:var(--muted)}
.cols2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:var(--surface)}
.stat .k{font-size:12px;color:var(--muted)}.stat .v{font-family:var(--font-mono);font-weight:600;font-size:22px}
.log{font-size:12.5px;margin:0;padding:0;list-style:none}
.log li{padding:3px 0;border-bottom:1px solid var(--line)}

</style>
</head>
<body>
<div class="wrap">
<a class="back" href="./">← 50の仮説</a>
<h1>コエカケタイミング</h1>
<section class="hypo" aria-label="仮説カード">
<dl>
<div><dt>視点</dt><dd>ビジネス・店側 ／ 具体</dd></div>
<div><dt>仮説</dt><dd>店員の一言で、列は整う。</dd></div>
<div><dt>確かめること</dt><dd><span class="hit">当たり＝店員が整えてくれる店なら安心</span><br><span class="miss">外れ＝声かけされても詰める人は詰める</span></dd></div>
</dl>
</section>
<div class="samplebar" id="samplebar">
<p id="sampleNote" class="note"></p>
<div class="row"><button type="button" class="btn ghost" id="btnClear">サンプルを消して自分で使う</button><button type="button" class="btn ghost" id="btnReset">サンプルに戻す</button></div>
<div id="confirmBox" class="confirm" hidden><p id="confirmMsg"></p><div class="row"><button type="button" class="btn primary" id="confirmYes">実行する</button><button type="button" class="btn ghost" id="confirmNo">やめる</button></div></div>
</div>

<div class="board" aria-live="polite">
<div class="cols">
<div><div class="lab">きょうの声かけ</div><div class="big"><span id="bVoice">0</span><small>回</small></div></div>
<div><div class="lab">いまの詰まり度</div><div class="big"><span id="bTight">0</span><small>/100</small></div></div>
</div>
<div class="sub" id="bSub"></div>
</div>
<section class="blk">
<h2>店員の画面</h2>
<p class="note">デモでは2秒＝店の1分。時刻は 11:00 開店から。</p>
<div class="row"><button type="button" class="btn" id="btnRun" aria-pressed="true">一時停止する</button><span class="note mono" id="clock"></span></div>
<div id="alerts" style="margin-top:8px" aria-live="polite"></div>
<svg id="spark" class="spark" viewBox="0 0 300 100" role="img" aria-label="列の詰まり度の推移"></svg>
<p class="note">折れ線＝詰まり度。点線＝70（要声かけの目安）。黄色の点＝声をかけたとき。</p>
</section>
<section class="blk">
<h2>声かけの効き目（前提）</h2>
<div class="sl"><label for="effect">声かけ1回で下がる詰まり度</label><span class="v" id="effectV"></span><input type="range" id="effect" min="5" max="60" step="5"></div>
<div class="sl"><label for="ignore">声をかけても詰める人の割合</label><span class="v" id="ignoreV"></span><input type="range" id="ignore" min="0" max="100" step="5"></div>
<div class="cols2">
<div class="stat"><div class="k">声かけが効いた</div><div class="v" id="sOk">0</div></div>
<div class="stat"><div class="k">効かなかった</div><div class="v" id="sNg">0</div></div>
</div>
<p class="note" id="avgDrop"></p>
</section>
<section class="blk"><h2>きょうの記録</h2><ul class="log" id="log"></ul></section>

<section class="feel" aria-label="触ってみた感想">
<h2>触ってみて、どちらに近い？</h2>
<div class="row"><button type="button" class="btn" id="feelHit">当たりに近い</button><button type="button" class="btn" id="feelMiss">外れに近い</button></div>
<p class="note" id="feelCount"></p>
</section>
</div>
<script>
function $(id){return document.getElementById(id)}
function esc(s){return String(s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function storeKey(){return 'hack3-'+FILE+'-v1'}
function loadState(){try{var s=localStorage.getItem(storeKey());return s?JSON.parse(s):null}catch(e){return null}}
function saveState(o){try{localStorage.setItem(storeKey(),JSON.stringify(o))}catch(e){}}
var G7={st:null,onClear:null,onReset:null,pending:null,rerender:null};
function sampleNoteUpdate(){
  var st=G7.st;
  $('sampleNote').textContent=st.sample?'サンプル表示中（数字はすべて架空）':'自分の入力で使用中（サンプルは消してあります）';
}
function sampleBar(st,onClear,onReset){
  G7.st=st;
  function ask(msg,fn){G7.pending=fn;$('confirmMsg').textContent=msg;$('confirmBox').hidden=false;$('confirmYes').focus()}
  $('btnClear').addEventListener('click',function(){ask('サンプルの数字を消して、空の状態から始めます。',function(){onClear();G7.st.sample=false})});
  $('btnReset').addEventListener('click',function(){ask('今の内容を捨てて、サンプルに戻します。',function(){onReset();G7.st.sample=true})});
  $('confirmNo').addEventListener('click',function(){G7.pending=null;$('confirmBox').hidden=true});
  $('confirmYes').addEventListener('click',function(){
    var f=G7.pending;G7.pending=null;$('confirmBox').hidden=true;
    if(f){f();sampleNoteUpdate();saveState(G7.st);if(G7.rerender)G7.rerender()}
  });
  sampleNoteUpdate();
}
function feelInit(st){
  if(!st.feel)st.feel={hit:0,miss:0};
  function show(){$('feelCount').textContent='この端末での記録: 当たり '+st.feel.hit+' ／ 外れ '+st.feel.miss}
  $('feelHit').addEventListener('click',function(){st.feel.hit++;saveState(st);show()});
  $('feelMiss').addEventListener('click',function(){st.feel.miss++;saveState(st);show()});
  show();
}
function seeded(seed){var s=seed>>>0;return function(){s=(s*1664525+1013904223)>>>0;return s/4294967296}}
function slider(id,label,min,max,step,val,unit){
  return '<div class="sl"><label for="'+id+'">'+label+'</label><span class="v" id="'+id+'V">'+val+unit+'</span><input type="range" id="'+id+'" min="'+min+'" max="'+max+'" step="'+step+'" value="'+val+'"></div>';
}

const FILE='g7-3';

var SAY={tight:['恐れ入ります、あと半歩だけ後ろにお願いできますか。','前の方との間隔を、少しだけゆったり取っていただけますか。','足元の線に沿って並んでいただけると助かります。'],two:['恐れ入ります、列は一列でお願いしています。最後尾はあちらです。','壁側に沿って、一列でお願いします。','最後尾までご案内しますね。']};
var TY={tight:'後ろが詰まっている',two:'2列になっている'};
function fmtTime(m){var t=660+m;return ('0'+Math.floor(t/60)).slice(-2)+':'+('0'+t%60).slice(-2)}
function fresh(){
  var r=seeded(7),s=[],v=42,voiced=[6,15,24,31,40],log=[];
  for(var i=0;i<45;i++){
    v+=Math.round((r()-0.42)*12);
    var vc=voiced.indexOf(i)>=0;
    if(vc){v-=18;log.push({m:i,ty:i%2?'two':'tight',ok:i!==31,drop:i!==31?18:0})}
    v=Math.max(8,Math.min(95,v));s.push({tight:v,voiced:vc});
  }
  return {sample:true,series:s,voices:5,okN:4,ngN:1,drops:[18,18,18,18],alerts:[],effect:35,ignore:30,running:true,log:log.reverse(),seq:0,feel:{hit:0,miss:0}};
}
var ST=loadState()||fresh();ST.running=true;
function nowTight(){return ST.series.length?ST.series[ST.series.length-1].tight:0}
function addAlert(ty){
  if(ST.alerts.some(function(a){return a.ty===ty}))return;
  ST.seq++;ST.alerts.push({ty:ty,m:ST.series.length,say:SAY[ty][ST.seq%3]});
}
function tick(){
  var v=nowTight()||30;
  v+=Math.round(Math.random()*9-3);
  if(Math.random()<0.14){var two=Math.random()<0.4;v+=two?22:15;addAlert(two?'two':'tight')}
  v=Math.max(5,Math.min(100,v));
  if(v>=70)addAlert('tight');
  ST.series.push({tight:v,voiced:false});
  if(ST.series.length>90)ST.series.shift();
  render();
}
function voice(i,skip){
  var a=ST.alerts[i];if(!a)return;
  ST.alerts.splice(i,1);
  if(skip){render();return}
  ST.voices++;
  var worked=Math.random()*100>=ST.ignore;
  var last=ST.series[ST.series.length-1];
  var drop=worked?Math.round(ST.effect*(0.7+Math.random()*0.6)):0;
  if(last){last.voiced=true;last.tight=Math.max(5,last.tight-drop)}
  if(worked){ST.okN++;ST.drops.push(drop)}else ST.ngN++;
  ST.log.unshift({m:ST.series.length,ty:a.ty,ok:worked,drop:drop});
  if(ST.log.length>30)ST.log.pop();
  render();
}
function spark(){
  var S=ST.series,W=300,H=100,n=Math.max(S.length,2),p=[],h='';
  var y=function(v){return H-6-(v/100)*(H-16)},x=function(i){return 4+i*(W-8)/(Math.max(n-1,1))};
  h+='<line class="th" x1="4" x2="'+(W-4)+'" y1="'+y(70)+'" y2="'+y(70)+'"/><text x="6" y="'+(y(70)-3)+'">70</text>';
  S.forEach(function(s,i){p.push(x(i).toFixed(1)+','+y(s.tight).toFixed(1))});
  if(p.length)h+='<polyline class="ln" points="'+p.join(' ')+'"/>';
  S.forEach(function(s,i){if(s.voiced)h+='<circle class="vc" cx="'+x(i).toFixed(1)+'" cy="'+y(s.tight).toFixed(1)+'" r="3.5"/>'});
  $('spark').innerHTML=h;
}
function render(){
  $('bVoice').textContent=ST.voices;$('bTight').textContent=nowTight();
  var avg=ST.series.length?Math.round(ST.series.reduce(function(a,s){return a+s.tight},0)/ST.series.length):0;
  $('bSub').textContent='ここまでの平均 詰まり度 '+avg;
  $('clock').textContent='いま '+fmtTime(ST.series.length);
  $('effectV').textContent='−'+ST.effect;$('ignoreV').textContent=ST.ignore+'%';
  $('sOk').textContent=ST.okN;$('sNg').textContent=ST.ngN;
  var d=ST.drops;$('avgDrop').textContent=d.length?'効いた声かけ1回あたりの詰まり度の下がり 平均 −'+Math.round(d.reduce(function(a,b){return a+b},0)/d.length):'まだ声かけの記録がありません。';
  var ah='';
  ST.alerts.forEach(function(a,i){ah+='<div class="alert"><div><span class="ty">'+TY[a.ty]+'</span> <span class="at">'+fmtTime(a.m)+'</span></div><div class="say">「'+esc(a.say)+'」</div><div class="row"><button type="button" class="btn primary" data-v="'+i+'">声をかけた</button><button type="button" class="btn ghost" data-s="'+i+'">見送る</button></div></div>'});
  $('alerts').innerHTML=ah||'<p class="note">いまは知らせはありません。</p>';
  $('log').innerHTML=ST.log.length?ST.log.map(function(l){return '<li><span class="mono">'+fmtTime(l.m)+'</span>　'+TY[l.ty]+' → '+(l.ok?'<span class="tag ok">効いた −'+l.drop+'</span>':'<span class="tag ng">効かなかった</span>')+'</li>'}).join(''):'<li class="note">まだありません。</li>';
  spark();saveState(ST);
}
$('alerts').addEventListener('click',function(e){
  var t=e.target;if(t.getAttribute('data-v')!==null)voice(+t.getAttribute('data-v'),false);
  else if(t.getAttribute('data-s')!==null)voice(+t.getAttribute('data-s'),true);
});
$('effect').value=ST.effect;$('ignore').value=ST.ignore;
$('effect').addEventListener('input',function(){ST.effect=+this.value;render()});
$('ignore').addEventListener('input',function(){ST.ignore=+this.value;render()});
var timer=null;
function setRun(on){
  ST.running=on;$('btnRun').setAttribute('aria-pressed',on?'true':'false');$('btnRun').textContent=on?'一時停止する':'再開する';
  if(timer){clearInterval(timer);timer=null}
  if(on)timer=setInterval(tick,2000);
}
$('btnRun').addEventListener('click',function(){setRun(!ST.running)});
sampleBar(ST,function(){ST.series=[];ST.voices=0;ST.okN=0;ST.ngN=0;ST.drops=[];ST.alerts=[];ST.log=[]},function(){var f=ST.feel,e=ST.effect,g=ST.ignore;Object.assign(ST,fresh());ST.feel=f;ST.effect=e;ST.ignore=g});
G7.rerender=function(){$('effect').value=ST.effect;$('ignore').value=ST.ignore;render()};
feelInit(ST);render();setRun(true);

</script>
</body>
</html>
