<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="claude:viewport-fit-sides" content="cover">
<title>モトガトレルカ</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@500;700&family=Noto+Sans+JP:wght@400;500;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
:root{
  --bg:#F1F3EF; --surface:#FFFFFF; --ink:#1A2320; --muted:#5E6B66; --line:#D9DED9;
  --signal:#E3A008; --signal-ink:#5A3E00; --ok:#2F7D6D; --ng:#C8512F; --board:#1F2A26; --board-ink:#F6C343;
  --font-display:"Zen Kaku Gothic New","Hiragino Sans","Noto Sans JP",sans-serif;
  --font-body:"Noto Sans JP","Hiragino Sans",sans-serif;
  --font-mono:"IBM Plex Mono",ui-monospace,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#111614; --surface:#1A201D; --ink:#E6ECE8; --muted:#9AA7A1; --line:#2C3531;
  --signal:#F2B632; --signal-ink:#2A1D00; --ok:#5FB8A3; --ng:#EE7C5A; --board:#0B0F0D; --board-ink:#F6C343; color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#111614; --surface:#1A201D; --ink:#E6ECE8; --muted:#9AA7A1; --line:#2C3531;
  --signal:#F2B632; --signal-ink:#2A1D00; --ok:#5FB8A3; --ng:#EE7C5A; --board:#0B0F0D; --board-ink:#F6C343; color-scheme:dark;}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);margin:0;font-size:15px;line-height:1.6}
.wrap{max-width:560px;margin:0 auto;padding-top:12px;padding-bottom:56px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.back{display:inline-block;color:var(--muted);font-size:13px;text-decoration:none;padding:4px 0}
.back:hover{text-decoration:underline}
h1{font-family:var(--font-display);font-size:26px;margin:4px 0 10px;letter-spacing:.02em}
h2{font-family:var(--font-display);font-size:17px;margin:0 0 8px}
h3{font-family:var(--font-display);font-size:15px;margin:0 0 6px}
p{margin:0 0 8px}
.note{font-size:12px;color:var(--muted);margin:4px 0}
.hypo{border:1px solid var(--line);border-left:4px solid var(--signal);border-radius:8px;background:var(--surface);padding:8px 12px;margin-bottom:12px;font-size:12.5px}
.hypo dl{margin:0}.hypo dl>div{display:flex;gap:10px;padding:2px 0}
.hypo dt{flex:0 0 5.4em;color:var(--muted);font-weight:500}.hypo dd{margin:0}
.hypo .hit{color:var(--ok)}.hypo .miss{color:var(--ng)}
.samplebar{border:1px dashed var(--line);border-radius:8px;padding:8px 12px;margin-bottom:14px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.btn{font:inherit;font-weight:500;font-size:14px;border:1px solid var(--ink);background:var(--surface);color:var(--ink);border-radius:8px;padding:9px 14px;min-height:44px;cursor:pointer}
.btn:hover{background:var(--bg)}
.btn.primary{background:var(--signal);border-color:var(--signal);color:var(--signal-ink);font-weight:700}
.btn.ghost{border-color:var(--line);color:var(--muted);font-size:12.5px;min-height:38px;padding:6px 10px}
.btn[aria-pressed="true"],.btn.on{background:var(--ink);color:var(--surface)}
.btn:focus-visible,input:focus-visible,select:focus-visible,summary:focus-visible,a:focus-visible{outline:3px solid var(--signal);outline-offset:2px}
.confirm{margin-top:8px;padding:8px 10px;background:var(--bg);border-radius:8px;font-size:13px}
.board{background:var(--board);color:var(--board-ink);border-radius:8px;padding:14px 16px;margin:12px 0}
.board .lab{font-size:12.5px;opacity:.85}
.board .big{font-family:var(--font-mono);font-variant-numeric:tabular-nums;font-weight:600;font-size:40px;line-height:1.15;letter-spacing:.01em}
.board .big small{font-size:16px;margin-left:4px}
.board .sub{font-size:12px;opacity:.8;margin-top:2px}
.board .cols{display:flex;gap:20px;flex-wrap:wrap}
section.blk{border-top:1px solid var(--line);padding:14px 0}
.feel{border-top:1px solid var(--line);padding:14px 0;margin-top:16px}
.mono{font-family:var(--font-mono);font-variant-numeric:tabular-nums}
label{font-size:13px}
input[type=number],input[type=text],select{font:inherit;font-size:14px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink);padding:6px 8px;min-height:40px;max-width:100%}
input[type=range]{width:100%;accent-color:var(--signal)}
.sl{display:grid;grid-template-columns:1fr auto;gap:2px 8px;align-items:center;margin:8px 0}
.sl .v{font-family:var(--font-mono);font-variant-numeric:tabular-nums;font-weight:600}
.sl input{grid-column:1/3}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{text-align:left;padding:5px 4px;border-bottom:1px solid var(--line);font-weight:500}
.tag{display:inline-block;font-size:11px;border:1px solid var(--line);border-radius:6px;padding:0 6px;color:var(--muted)}
.tag.ok{color:var(--ok);border-color:var(--ok)}.tag.ng{color:var(--ng);border-color:var(--ng)}
details{margin:8px 0}summary{cursor:pointer;font-size:13px;color:var(--muted);min-height:32px}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important;scroll-behavior:auto!important}}


.m{border-bottom:1px solid var(--line);padding:10px 0}
.m .hd{display:flex;align-items:center;gap:10px;min-height:44px}
.m .hd input{width:22px;height:22px;accent-color:var(--signal)}
.m .hd .nm{font-family:var(--font-display);font-weight:700;flex:1}
.m .pb{font-family:var(--font-mono);font-weight:600;font-variant-numeric:tabular-nums}
.m .pb.ng{color:var(--ng)}
.m .sm{font-size:12px;color:var(--muted);margin-left:32px}
.m .ed{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin:6px 0 0 32px;font-size:12px}
.m .ed label{display:grid;gap:2px}
.chart{width:100%;height:auto;display:block;background:var(--surface);border:1px solid var(--line);border-radius:8px}
.chart .z{stroke:var(--muted);stroke-width:1}
.chart .ln{fill:none;stroke:var(--ok);stroke-width:2}
.chart .ln.neg{stroke:var(--ng)}
.chart text{fill:var(--muted);font-size:9px;font-family:var(--font-mono)}
.chart .mk{fill:var(--signal);stroke:var(--signal-ink)}
.res{background:var(--bg);border-radius:8px;padding:10px 12px;font-size:13.5px}
.res b{font-family:var(--font-mono)}

</style>
</head>
<body>
<div class="wrap">
<a class="back" href="./">← 50の仮説</a>
<h1>モトガトレルカ</h1>
<section class="hypo" aria-label="仮説カード">
<dl>
<div><dt>視点</dt><dd>ビジネス・店側 ／ 具体</dd></div>
<div><dt>仮説</dt><dd>列の対策（足元マーク・ポール・整理券）は、店にとって元が取れる。</dd></div>
<div><dt>確かめること</dt><dd><span class="hit">当たり＝試算を見て店主が導入したくなる数字になる</span><br><span class="miss">外れ＝費用の方が大きい</span></dd></div>
</dl>
</section>
<div class="samplebar" id="samplebar">
<p id="sampleNote" class="note"></p>
<div class="row"><button type="button" class="btn ghost" id="btnClear">サンプルを消して自分で使う</button><button type="button" class="btn ghost" id="btnReset">サンプルに戻す</button></div>
<div id="confirmBox" class="confirm" hidden><p id="confirmMsg"></p><div class="row"><button type="button" class="btn primary" id="confirmYes">実行する</button><button type="button" class="btn ghost" id="confirmNo">やめる</button></div></div>
</div>

<div class="board" aria-live="polite">
<div class="lab" id="bLab">選んだ対策で、元が取れるまで</div>
<div class="big"><span id="bMon">–</span><small id="bUnit">か月</small></div>
<div class="sub" id="bSub"></div>
</div>
<section class="blk">
<h2>お店の前提</h2>
<div class="sl"><label for="price">客単価</label><span class="v" id="priceV"></span><input type="range" id="price" min="0" max="2500" step="50"></div>
<div class="sl"><label for="cust">月の来店客数</label><span class="v" id="custV"></span><input type="range" id="cust" min="0" max="6000" step="100"></div>
<div class="sl"><label for="leave">月に見て帰る人（列を見て入らない）</label><span class="v" id="leaveV"></span><input type="range" id="leave" min="0" max="800" step="10"></div>
<div class="sl"><label for="margin">粗利率（売上のうち手元に残る割合）</label><span class="v" id="marginV"></span><input type="range" id="margin" min="0" max="80" step="5"></div>
</section>
<section class="blk">
<h2>対策を選んで組み合わせる</h2>
<p class="note">チェックした対策の合計が上のボードに出ます。数字（費用・効果）は「詳細」から直せます。効果が重なる分は割り引いて計算します。</p>
<div id="ms"></div>
</section>
<section class="blk">
<h2>累計の損益（月ごと）</h2>
<svg id="chart" class="chart" viewBox="0 0 300 120" role="img" aria-label="累計の損益の推移"></svg>
<div class="res" id="res" style="margin-top:8px"></div>
</section>

<section class="feel" aria-label="触ってみた感想">
<h2>触ってみて、どちらに近い？</h2>
<div class="row"><button type="button" class="btn" id="feelHit">当たりに近い</button><button type="button" class="btn" id="feelMiss">外れに近い</button></div>
<p class="note" id="feelCount"></p>
</section>
</div>
<script>
function $(id){return document.getElementById(id)}
function esc(s){return String(s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function storeKey(){return 'hack3-'+FILE+'-v1'}
function loadState(){try{var s=localStorage.getItem(storeKey());return s?JSON.parse(s):null}catch(e){return null}}
function saveState(o){try{localStorage.setItem(storeKey(),JSON.stringify(o))}catch(e){}}
var G7={st:null,onClear:null,onReset:null,pending:null,rerender:null};
function sampleNoteUpdate(){
  var st=G7.st;
  $('sampleNote').textContent=st.sample?'サンプル表示中（数字はすべて架空）':'自分の入力で使用中（サンプルは消してあります）';
}
function sampleBar(st,onClear,onReset){
  G7.st=st;
  function ask(msg,fn){G7.pending=fn;$('confirmMsg').textContent=msg;$('confirmBox').hidden=false;$('confirmYes').focus()}
  $('btnClear').addEventListener('click',function(){ask('サンプルの数字を消して、空の状態から始めます。',function(){onClear();G7.st.sample=false})});
  $('btnReset').addEventListener('click',function(){ask('今の内容を捨てて、サンプルに戻します。',function(){onReset();G7.st.sample=true})});
  $('confirmNo').addEventListener('click',function(){G7.pending=null;$('confirmBox').hidden=true});
  $('confirmYes').addEventListener('click',function(){
    var f=G7.pending;G7.pending=null;$('confirmBox').hidden=true;
    if(f){f();sampleNoteUpdate();saveState(G7.st);if(G7.rerender)G7.rerender()}
  });
  sampleNoteUpdate();
}
function feelInit(st){
  if(!st.feel)st.feel={hit:0,miss:0};
  function show(){$('feelCount').textContent='この端末での記録: 当たり '+st.feel.hit+' ／ 外れ '+st.feel.miss}
  $('feelHit').addEventListener('click',function(){st.feel.hit++;saveState(st);show()});
  $('feelMiss').addEventListener('click',function(){st.feel.miss++;saveState(st);show()});
  show();
}
function seeded(seed){var s=seed>>>0;return function(){s=(s*1664525+1013904223)>>>0;return s/4294967296}}
function slider(id,label,min,max,step,val,unit){
  return '<div class="sl"><label for="'+id+'">'+label+'</label><span class="v" id="'+id+'V">'+val+unit+'</span><input type="range" id="'+id+'" min="'+min+'" max="'+max+'" step="'+step+'" value="'+val+'"></div>';
}

const FILE='g7-4';

function fresh(){return {sample:true,price:900,cust:1800,leave:200,margin:65,
 ms:[
 {id:'foot',n:'足元マーク',on:true,init:30000,mon:0,cut:8,rep:0.5},
 {id:'pole',n:'立ち位置ポール・ロープ',on:false,init:90000,mon:2000,cut:6,rep:0.4},
 {id:'tick',n:'整理券・呼び出し',on:true,init:60000,mon:18000,cut:25,rep:1.2},
 {id:'staff',n:'列の案内スタッフを増やす',on:false,init:20000,mon:60000,cut:10,rep:0.8}],
 feel:{hit:0,miss:0}}}
var ST=loadState()||fresh();
var HOR=18;
function gain(ms){
  var cut=1,rep=1;
  ms.forEach(function(m){cut*=1-m.cut/100;rep*=1-m.rep/100});
  cut=1-cut;rep=1-rep;
  var g=(cut*ST.leave*ST.price+rep*ST.cust*ST.price)*ST.margin/100;
  var cost=ms.reduce(function(a,m){return a+m.mon},0);
  return {g:g,cost:cost,net:g-cost,init:ms.reduce(function(a,m){return a+m.init},0),cut:cut,rep:rep};
}
function payback(r){if(r.init===0)return 0;return r.net>0?r.init/r.net:Infinity}
function fmtPb(p){return p===Infinity?'回収できない':(p===0?'0.0か月':p.toFixed(1)+'か月')}
function yen(n){return Math.round(n).toLocaleString()+'円'}
function render(){
  $('priceV').textContent=ST.price+'円';$('custV').textContent=ST.cust+'人';$('leaveV').textContent=ST.leave+'人';$('marginV').textContent=ST.margin+'%';
  var on=ST.ms.filter(function(m){return m.on}),R=gain(on),pb=payback(R);
  if(!on.length){$('bMon').textContent='–';$('bUnit').textContent='';$('bSub').textContent='対策を1つ以上チェックすると出ます'}
  else if(pb===Infinity){$('bMon').textContent='×';$('bUnit').textContent='回収できない';$('bSub').textContent='月の効果 '+yen(R.g)+' が 月額費用 '+yen(R.cost)+' に届かない'}
  else{$('bMon').textContent=pb.toFixed(1);$('bUnit').textContent='か月';$('bSub').textContent='初期 '+yen(R.init)+' ／ 月の手残り +'+yen(R.net)}
  if(G7.force||!$('ms').firstChild){
    var h='';
    ST.ms.forEach(function(m,i){
      var r=gain([m]),p=payback(r);
      h+='<div class="m"><div class="hd"><input type="checkbox" id="on'+i+'" data-i="'+i+'" '+(m.on?'checked':'')+' aria-label="'+esc(m.n)+'を組み合わせに入れる"><label class="nm" for="on'+i+'">'+esc(m.n)+'</label><span class="pb'+(p===Infinity?' ng':'')+'" id="pb'+i+'">'+fmtPb(p)+'</span></div>'
      +'<div class="sm" id="sm'+i+'"></div>'
      +'<details><summary>詳細（費用・効果を直す）</summary><div class="ed">'
      +'<label>初期費用（円）<input type="number" min="0" step="1000" data-i="'+i+'" data-k="init" value="'+m.init+'"></label>'
      +'<label>月額（円）<input type="number" min="0" step="1000" data-i="'+i+'" data-k="mon" value="'+m.mon+'"></label>'
      +'<label>見て帰る人の減り（%）<input type="number" min="0" max="100" step="1" data-i="'+i+'" data-k="cut" value="'+m.cut+'"></label>'
      +'<label>再来店率の上がり（pt）<input type="number" min="0" max="20" step="0.1" data-i="'+i+'" data-k="rep" value="'+m.rep+'"></label>'
      +'</div></details></div>';
    });
    $('ms').innerHTML=h;G7.force=false;
  }
  ST.ms.forEach(function(m,i){
    var r=gain([m]),p=payback(r);
    if($('pb'+i)){$('pb'+i).textContent=fmtPb(p);$('pb'+i).className='pb'+(p===Infinity?' ng':'');
    $('sm'+i).textContent='月の効果 +'+yen(r.g)+' − 月額 '+yen(r.cost)+' ＝ '+(r.net>=0?'+':'')+yen(r.net)+' ／ 初期 '+yen(r.init)}
  });
  chart(R,on.length>0);
  $('res').innerHTML=on.length?('組み合わせ: 見て帰る人 <b>−'+(R.cut*100).toFixed(1)+'%</b>（月 約'+Math.round(R.cut*ST.leave)+'人）、再来店率 <b>+'+(R.rep*100).toFixed(1)+'pt</b>。<br>'+HOR+'か月後の累計: <b>'+(R.net*HOR-R.init>=0?'+':'')+yen(R.net*HOR-R.init)+'</b>'):'対策が選ばれていません。';
  saveState(ST);
}
function chart(R,any){
  var W=300,H=120,vals=[],i;
  for(i=0;i<=HOR;i++)vals.push(any?-R.init+R.net*i:0);
  var mn=Math.min.apply(null,vals.concat([0])),mx=Math.max.apply(null,vals.concat([0]));
  if(mx-mn<1){mx=mn+1}
  var x=function(k){return 8+k*(W-16)/HOR},y=function(v){return 10+(mx-v)/(mx-mn)*(H-26)};
  var h='<line class="z" x1="8" x2="'+(W-8)+'" y1="'+y(0)+'" y2="'+y(0)+'"/><text x="10" y="'+(y(0)-3)+'">0円</text>';
  h+='<polyline class="ln'+(R.net<=0&&any?' neg':'')+'" points="'+vals.map(function(v,k){return x(k).toFixed(1)+','+y(v).toFixed(1)}).join(' ')+'"/>';
  var pb=payback(R);
  if(any&&pb!==Infinity&&pb<=HOR&&pb>0)h+='<circle class="mk" r="4" cx="'+x(pb).toFixed(1)+'" cy="'+y(0)+'"/>';
  h+='<text x="8" y="'+(H-4)+'">0</text><text x="'+(W-34)+'" y="'+(H-4)+'">'+HOR+'か月</text>';
  $('chart').innerHTML=h;
}
['price','cust','leave','margin'].forEach(function(k){
  $(k).value=ST[k];$(k).addEventListener('input',function(){ST[k]=parseFloat(this.value);render()});
});
$('ms').addEventListener('change',function(e){
  var t=e.target,i=t.getAttribute('data-i');if(i===null)return;
  if(t.type==='checkbox'){ST.ms[i].on=t.checked}
  render();
});
$('ms').addEventListener('input',function(e){
  var t=e.target,k=t.getAttribute('data-k');if(!k)return;
  ST.ms[+t.getAttribute('data-i')][k]=Math.max(0,parseFloat(t.value)||0);ST.sample=false;sampleNoteUpdate();render();
});
sampleBar(ST,function(){ST.price=0;ST.cust=0;ST.leave=0;ST.margin=0;ST.ms.forEach(function(m){m.on=false;m.init=0;m.mon=0;m.cut=0;m.rep=0})},function(){var f=ST.feel;Object.assign(ST,fresh());ST.feel=f});
G7.rerender=function(){['price','cust','leave','margin'].forEach(function(k){$(k).value=ST[k]});G7.force=true;render()};
feelInit(ST);G7.force=true;render();

</script>
</body>
</html>
