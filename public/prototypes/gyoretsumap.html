<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="claude:viewport-fit-sides" content="cover">
<title>ギョウレツマップ</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@500;700&family=Noto+Sans+JP:wght@400;500;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
:root{
  --bg:#F1F3EF; --surface:#FFFFFF; --ink:#1A2320; --muted:#5E6B66; --line:#D9DED9;
  --signal:#E3A008; --signal-ink:#5A3E00; --ok:#2F7D6D; --ng:#C8512F; --board:#1F2A26; --board-ink:#F6C343;
  --font-display:"Zen Kaku Gothic New","Hiragino Sans","Noto Sans JP",sans-serif;
  --font-body:"Noto Sans JP","Hiragino Sans",sans-serif;
  --font-mono:"IBM Plex Mono",ui-monospace,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#111614; --surface:#1A201D; --ink:#E6ECE8; --muted:#9AA7A1; --line:#2C3531;
  --signal:#F2B632; --signal-ink:#2A1D00; --ok:#5FB8A3; --ng:#EE7C5A; --board:#0B0F0D; --board-ink:#F6C343; color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#111614; --surface:#1A201D; --ink:#E6ECE8; --muted:#9AA7A1; --line:#2C3531;
  --signal:#F2B632; --signal-ink:#2A1D00; --ok:#5FB8A3; --ng:#EE7C5A; --board:#0B0F0D; --board-ink:#F6C343; color-scheme:dark;}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);margin:0}
*{box-sizing:border-box}
.wrap{max-width:560px;margin:0 auto;padding:12px max(16px, env(safe-area-inset-left, 0px)) 40px;padding-right:max(16px, env(safe-area-inset-right, 0px))}
a{color:var(--ink)}
.back{display:inline-block;font-size:13px;margin-bottom:10px;padding:4px 0}
:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
h1{font-family:var(--font-display);font-size:24px;margin:0 0 8px;letter-spacing:.02em}
h2{font-family:var(--font-display);font-size:15px;margin:22px 0 8px}
.hyp{border-left:4px solid var(--signal);background:var(--surface);padding:8px 12px;font-size:14px;font-weight:500;margin:0 0 14px;border-radius:0 8px 8px 0}
.hyp small{display:block;color:var(--muted);font-weight:400;font-size:11px;margin-bottom:2px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip,.seg button,.rep button,.act button,.sel button{font:inherit;cursor:pointer}
.chip{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:8px;padding:8px 10px;font-size:13px;min-height:40px;text-align:left}
.chip small{display:block;color:var(--muted);font-size:10px}
.chip[aria-pressed="true"]{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink);font-weight:700}
.board{background:var(--board);color:var(--board-ink);border-radius:8px;padding:14px 14px 12px;margin:14px 0 0}
.board .top{font-size:12px;opacity:.85;display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.board .big{display:flex;gap:18px;align-items:baseline;flex-wrap:wrap;margin:8px 0 4px}
.board .num{font-family:var(--font-mono);font-variant-numeric:tabular-nums;font-weight:600;font-size:34px;line-height:1.1}
.board .num small{font-size:14px;margin-left:2px}
.board .lbl{font-size:11px;opacity:.8;display:block;font-family:var(--font-body);font-weight:400}
.board .best{border-top:1px dashed var(--board-ink);margin-top:10px;padding-top:8px;font-size:13px}
.board .best b{font-family:var(--font-mono);font-variant-numeric:tabular-nums;font-size:20px}
.board .foot{font-size:11px;opacity:.8;margin-top:6px}
.sel{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:10px 0 0;font-size:13px}
.sel select{font:inherit;font-size:14px;padding:6px 8px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink);min-height:36px}
.sel button{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:8px;padding:6px 10px;font-size:12px;min-height:36px}
.seg{display:flex;border:1px solid var(--ink);border-radius:8px;overflow:hidden}
.seg button{flex:1;border:0;background:var(--surface);color:var(--ink);padding:10px 8px;font-size:13px;min-height:44px}
.seg button+button{border-left:1px solid var(--ink)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--surface);font-weight:700}
.grid{display:grid;grid-template-columns:34px repeat(7,minmax(0,1fr));gap:3px;margin-top:10px}
.grid .dh{font-size:12px;text-align:center;color:var(--muted);padding:2px 0;font-weight:500}
.grid .dh.sel-d{color:var(--ink);font-weight:700}
.grid .hh{font-family:var(--font-mono);font-variant-numeric:tabular-nums;font-size:11px;color:var(--muted);display:flex;align-items:center;justify-content:flex-end;padding-right:4px}
.grid .gap{grid-column:1/-1;height:6px;border-top:1px dashed var(--line);margin-top:2px}
.cell{font:inherit;border:1px solid transparent;border-radius:4px;height:36px;padding:0;background:var(--surface);color:var(--ink);font-size:12px;font-family:var(--font-mono);font-variant-numeric:tabular-nums;cursor:pointer}
.d1{background:color-mix(in srgb,var(--ok) 38%,var(--surface))}
.d2{background:color-mix(in srgb,var(--signal) 42%,var(--surface))}
.d3{background:color-mix(in srgb,var(--ng) 60%,var(--surface))}
.l0{background:color-mix(in srgb,var(--signal) 10%,var(--surface))}
.l1{background:color-mix(in srgb,var(--signal) 28%,var(--surface))}
.l2{background:color-mix(in srgb,var(--signal) 50%,var(--surface))}
.l3{background:color-mix(in srgb,var(--signal) 78%,var(--surface))}
.cell.none{background:var(--surface);border:1px dashed var(--line);color:var(--muted)}
.cell.closed{background:transparent;border:1px solid var(--line);color:var(--muted);cursor:default}
.cell.best{border:2px dashed var(--ink)}
.cell.cur{border:2px solid var(--ink);box-shadow:0 0 0 2px var(--bg),0 0 0 4px var(--ink)}
.legend{display:flex;flex-wrap:wrap;gap:10px;font-size:11px;color:var(--muted);margin-top:10px;align-items:center}
.legend i{display:inline-block;width:14px;height:14px;border-radius:3px;vertical-align:-3px;margin-right:4px;border:1px solid var(--line)}
.note{font-size:12px;color:var(--muted);margin:6px 0 0}
.rep{border-top:1px solid var(--line);margin-top:26px;padding-top:12px}
.rep p{margin:0 0 6px;font-size:12px;color:var(--muted)}
.rep .row{display:flex;gap:6px}
.rep button{flex:1;border:1px solid var(--ink);background:var(--signal);color:var(--signal-ink);border-radius:8px;padding:8px 4px;font-size:13px;font-weight:700;min-height:44px}
.rep button:disabled{background:var(--surface);color:var(--muted);border-color:var(--line);cursor:default}
.toast{min-height:20px;font-size:12px;margin-top:8px;color:var(--ok);font-weight:500}
.sample{margin-top:22px;border-top:1px solid var(--line);padding-top:10px;font-size:11px;color:var(--muted)}
.act{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.act button{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:8px;padding:8px 10px;font-size:12px;min-height:40px}
.confirm{margin-top:8px;border:1px solid var(--ng);border-radius:8px;padding:10px;font-size:13px;color:var(--ink);background:var(--surface)}
.confirm[hidden]{display:none}
.confirm .act button.go{background:var(--ng);color:var(--surface);border-color:var(--ng);font-weight:700}
@media (prefers-reduced-motion: no-preference){.cell{transition:background .2s}}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <a class="back" href="./">← 50の仮説</a>
  <h1>ギョウレツマップ</h1>
  <p class="hyp"><small>確かめたい仮説</small>店は変えなくても、列が空いている時間が分かれば、行く時間は変える。</p>

  <div id="shops" class="chips" role="group" aria-label="店を選ぶ"></div>

  <div class="board" id="board" aria-live="polite"></div>

  <div class="sel">
    <label for="sel-day">見る日時</label>
    <select id="sel-day"></select>
    <select id="sel-hour" aria-label="時間帯"></select>
    <button type="button" id="btn-now">いまに合わせる</button>
  </div>

  <h2>曜日 × 時間帯のようす</h2>
  <div class="seg" role="group" aria-label="表示する指標">
    <button type="button" id="m-density" aria-pressed="true">列の詰まり具合</button>
    <button type="button" id="m-length" aria-pressed="false">列の長さ（人数）</button>
  </div>
  <div class="grid" id="grid"></div>
  <div class="legend" id="legend"></div>
  <p class="note" id="gridnote"></p>

  <div class="rep">
    <p id="rep-label">いま並んでいるなら1タップで報告（この店の、見ている日時の枠に1件加わります）</p>
    <div class="row" role="group" aria-labelledby="rep-label">
      <button type="button" id="r-1">ゆったり</button>
      <button type="button" id="r-2">ふつう</button>
      <button type="button" id="r-3">詰まりぎみ</button>
    </div>
    <div class="toast" id="toast" role="status" aria-live="polite"></div>
  </div>

  <div class="sample">
    <span id="mode-note"></span>
    <div class="act">
      <button type="button" id="b-clear">サンプルを消して自分で使う</button>
      <button type="button" id="b-reset">サンプルに戻す</button>
    </div>
    <div class="confirm" id="confirm" hidden>
      <div id="confirm-msg"></div>
      <div class="act"><button type="button" class="go" id="c-ok">実行する</button><button type="button" id="c-cancel">やめる</button></div>
    </div>
  </div>
</div>

<script>
(function(){
'use strict';
var KEY='hack-gyoretsumap-v1';
var DAYS=['月','火','水','木','金','土','日'];
var HOURS=[11,12,13,14,17,18,19,20,21];
var LV=['','ゆったり','ふつう','詰まりぎみ'];
var GLYPH=['','ゆ','ふ','詰'];
var SHOPS=[
 {id:'toka',name:'麺屋 灯火',kind:'ラーメン',scale:14,lunch:1.0,dinner:0.8,closedDay:-1,lastHour:21,seed:11},
 {id:'shiomichi',name:'らーめん 潮路',kind:'ラーメン',scale:11,lunch:0.8,dinner:1.15,closedDay:-1,lastHour:21,seed:23},
 {id:'sumi',name:'煮干し 澄',kind:'ラーメン',scale:17,lunch:1.0,dinner:0.9,closedDay:2,lastHour:21,seed:37},
 {id:'hakuun',name:'つけ麺 白雲',kind:'つけ麺',scale:12,lunch:1.0,dinner:0.85,closedDay:0,lastHour:20,seed:41},
 {id:'hidamari',name:'パン工房 ひだまり',kind:'パン',scale:9,lunch:1.0,dinner:0.5,closedDay:-1,lastHour:18,seed:59}
];
var TYP=[0,0.3,0.65,1];

var state=null;
var view={day:0,hour:12};
var pending=null;
var mem=null;

function mulberry(a){return function(){a|=0;a=a+0x6D2B79F5|0;var t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
function shopById(id){for(var i=0;i<SHOPS.length;i++){if(SHOPS[i].id===id)return SHOPS[i];}return SHOPS[0];}
function isOpen(shop,day,hour){return day!==shop.closedDay&&hour<=shop.lastHour;}
function peakOf(shop,day,hour){
  var lunch={11:0.3,12:1.0,13:0.7,14:0.15};
  var dinner={17:0.2,18:0.55,19:0.8,20:0.65,21:0.3};
  var p;
  if(hour<=14){
    p=lunch[hour]*shop.lunch;
    if(day===5&&(hour===12||hour===13))p=1.0*shop.lunch;
    if(day===6)p=p*0.9;
  }else{
    p=dinner[hour]*shop.dinner;
    if(day===4||day===5)p=p*1.15;
    if(day===6)p=p*0.85;
  }
  return Math.max(0,Math.min(1,p));
}
function genShop(shop){
  var rnd=mulberry(shop.seed*1009+7);
  var cells={};
  for(var d=0;d<7;d++){
    for(var hi=0;hi<HOURS.length;hi++){
      var h=HOURS[hi];
      if(!isOpen(shop,d,h))continue;
      var pk=peakOf(shop,d,h);
      var dens=1+2*Math.pow(pk,1.3)+(rnd()-0.5)*0.3;
      dens=Math.max(1,Math.min(3,dens));
      var len=Math.max(1,Math.round(shop.scale*pk*(0.85+rnd()*0.3)+1));
      var n=4+Math.round(rnd()*6+pk*8);
      cells[d+'-'+h]=[n,+(dens*n).toFixed(3),len*n];
    }
  }
  return cells;
}
function sampleState(){
  var s={mode:'sample',shop:SHOPS[0].id,metric:'density',data:{}};
  for(var i=0;i<SHOPS.length;i++)s.data[SHOPS[i].id]=genShop(SHOPS[i]);
  return s;
}
function emptyState(prev){
  var s={mode:'own',shop:prev.shop,metric:prev.metric,data:{}};
  for(var i=0;i<SHOPS.length;i++)s.data[SHOPS[i].id]={};
  return s;
}
function validState(s){
  if(!s||typeof s!=='object'||!s.data||typeof s.data!=='object')return false;
  if(s.mode!=='sample'&&s.mode!=='own')return false;
  for(var i=0;i<SHOPS.length;i++){if(!s.data[SHOPS[i].id]||typeof s.data[SHOPS[i].id]!=='object')return false;}
  return true;
}
function load(){
  try{
    var raw=window.localStorage.getItem(KEY);
    if(raw){var s=JSON.parse(raw);if(validState(s)){if(s.metric!=='length')s.metric='density';s.shop=shopById(s.shop).id;return s;}}
  }catch(e){}
  return null;
}
function save(){
  try{window.localStorage.setItem(KEY,JSON.stringify(state));}catch(e){}
}

function cellStat(shopId,d,h){
  var c=state.data[shopId][d+'-'+h];
  if(!c||!c[0])return null;
  var dens=c[1]/c[0];
  return {n:c[0],dens:dens,len:c[2]/c[0],lv:dens<1.67?1:(dens<2.34?2:3)};
}
function shopTotal(shopId){
  var t=0,o=state.data[shopId];
  for(var k in o){if(Object.prototype.hasOwnProperty.call(o,k))t+=o[k][0];}
  return t;
}
function bestHour(shop,d){
  var best=null;
  for(var i=0;i<HOURS.length;i++){
    var st=cellStat(shop.id,d,HOURS[i]);
    if(!st||st.n<3)continue;
    if(!best||st.dens<best.st.dens-0.001||(Math.abs(st.dens-best.st.dens)<=0.001&&st.len<best.st.len))best={h:HOURS[i],st:st};
  }
  return best;
}
function snapHour(h){
  var b=HOURS[0],bd=99;
  for(var i=0;i<HOURS.length;i++){var dd=Math.abs(HOURS[i]-h);if(dd<bd){bd=dd;b=HOURS[i];}}
  return b;
}
function setNow(){
  var n=new Date();
  view.day=(n.getDay()+6)%7;
  view.hour=snapHour(n.getHours());
}

function $(id){return document.getElementById(id);}
function el(tag,cls,text){var e=document.createElement(tag);if(cls)e.className=cls;if(text!==undefined)e.textContent=text;return e;}
function clear(e){while(e.firstChild)e.removeChild(e.firstChild);}

function renderShops(){
  var box=$('shops');clear(box);
  SHOPS.forEach(function(s){
    var b=el('button','chip');b.type='button';b.id='shop-'+s.id;
    b.setAttribute('aria-pressed',s.id===state.shop?'true':'false');
    b.appendChild(document.createTextNode(s.name));
    b.appendChild(el('small','',s.kind));
    b.addEventListener('click',function(){state.shop=s.id;save();toastMsg('');renderAll();});
    box.appendChild(b);
  });
}
function renderBoard(){
  var shop=shopById(state.shop),b=$('board');clear(b);
  var top=el('div','top');
  top.appendChild(el('span','','いま　'+shop.name));
  top.appendChild(el('span','',DAYS[view.day]+'曜 '+view.hour+'時台'));
  b.appendChild(top);
  var total=shopTotal(shop.id);
  if(!isOpen(shop,view.day,view.hour)){
    b.appendChild(el('div','big',''));
    b.lastChild.appendChild(el('span','num','営業時間外'));
  }else{
    var st=cellStat(shop.id,view.day,view.hour);
    var big=el('div','big');
    if(st){
      var a=el('span','num');a.appendChild(document.createTextNode('約'+Math.round(st.len)));
      a.appendChild(el('small','','人'));a.insertBefore(el('span','lbl','この店の列'),a);
      var g=el('span','num',LV[st.lv]);g.insertBefore(el('span','lbl','間隔'),g.firstChild);
      big.appendChild(a);big.appendChild(g);
    }else{
      big.appendChild(el('span','num','報告なし'));
    }
    b.appendChild(big);
  }
  var best=bestHour(shop,view.day);
  var bd=el('div','best');
  if(best){
    bd.appendChild(document.createTextNode('データでは、'+DAYS[view.day]+'曜で一番ゆったりする時間帯は '));
    bd.appendChild(el('b','',best.h+'時台'));
    bd.appendChild(document.createTextNode('（間隔 '+LV[best.st.lv]+'・約'+Math.round(best.st.len)+'人）'));
  }else{
    bd.appendChild(document.createTextNode('この曜日は、算出に足りる報告がまだありません。'));
  }
  b.appendChild(bd);
  var cs=isOpen(shop,view.day,view.hour)?cellStat(shop.id,view.day,view.hour):null;
  b.appendChild(el('div','foot','参考値　報告'+total+'件から算出'+(cs?'（この枠は'+cs.n+'件）':'')));
}
function renderSel(){
  $('sel-day').value=String(view.day);
  $('sel-hour').value=String(view.hour);
}
function renderGrid(){
  var shop=shopById(state.shop),g=$('grid');clear(g);
  var dens=state.metric==='density';
  g.appendChild(el('div','dh',''));
  DAYS.forEach(function(d,i){g.appendChild(el('div','dh'+(i===view.day?' sel-d':''),d));});
  var best=bestHour(shop,view.day);
  HOURS.forEach(function(h,hi){
    if(hi===4){g.appendChild(el('div','gap'));}
    g.appendChild(el('div','hh',String(h)));
    for(var d=0;d<7;d++){
      var open=isOpen(shop,d,h);
      var b=el('button','cell');b.type='button';
      b.id='cell-'+d+'-'+h;
      var label=DAYS[d]+'曜'+h+'時台';
      if(!open){
        b.className='cell closed';b.textContent='休';b.setAttribute('aria-label',label+' 営業時間外');b.disabled=true;
      }else{
        var st=cellStat(shop.id,d,h);
        if(!st){b.className='cell none';b.textContent='–';b.setAttribute('aria-label',label+' 報告なし');}
        else if(dens){b.className='cell d'+st.lv;b.textContent=GLYPH[st.lv];b.setAttribute('aria-label',label+' 間隔 '+LV[st.lv]+' 報告'+st.n+'件');}
        else{
          var lc=st.len<5?0:(st.len<10?1:(st.len<15?2:3));
          b.className='cell l'+lc;b.textContent=String(Math.round(st.len));
          b.setAttribute('aria-label',label+' 約'+Math.round(st.len)+'人 報告'+st.n+'件');
        }
        if(best&&d===view.day&&h===best.h)b.className+=' best';
        b.addEventListener('click',(function(dd,hh){return function(){view.day=dd;view.hour=hh;toastMsg('');renderAll();};})(d,h));
      }
      if(d===view.day&&h===view.hour)b.className+=' cur';
      g.appendChild(b);
    }
  });
  var lg=$('legend');clear(lg);
  function sw(cls,txt){var s=el('span','');var i=el('i','');i.className=cls;s.appendChild(i);s.appendChild(document.createTextNode(txt));lg.appendChild(s);}
  if(dens){sw('cell d1','ゆったり（ゆ）');sw('cell d2','ふつう（ふ）');sw('cell d3','詰まりぎみ（詰）');}
  else{sw('cell l0','〜4人');sw('cell l1','5〜9人');sw('cell l2','10〜14人');sw('cell l3','15人〜');}
  var s2=el('span','');var i2=el('i','');i2.style.borderStyle='dashed';i2.style.borderColor='var(--ink)';s2.appendChild(i2);s2.appendChild(document.createTextNode('点線＝'+DAYS[view.day]+'曜で一番ゆったり'));lg.appendChild(s2);
  $('gridnote').textContent=dens
    ?'詰まり具合は、前後の人との間隔の報告の平均です。上段は昼（11〜14時台）、下段は夜（17〜21時台）。枠をタップすると、その日時を見られます。'
    :'人数は、報告された列の長さの平均です（概算）。上段は昼、下段は夜。枠をタップすると、その日時を見られます。';
}
function renderRep(){
  var shop=shopById(state.shop);
  var open=isOpen(shop,view.day,view.hour);
  for(var k=1;k<=3;k++){$('r-'+k).disabled=!open;}
  $('rep-label').textContent=open
    ?'いま並んでいるなら1タップで報告（'+shop.name+'・'+DAYS[view.day]+'曜 '+view.hour+'時台の枠に1件加わります）'
    :'見ている日時は営業時間外のため、報告できません。';
}
function renderMode(){
  $('mode-note').textContent=state.mode==='sample'
    ?'表示中はサンプルです（架空の店・各店数百件の擬似報告）。実在の店や実際の混雑とは関係ありません。'
    :'サンプルを消して、自分用に使っています。報告が加わるたびに、この画面が育ちます。';
}
function renderMetric(){
  $('m-density').setAttribute('aria-pressed',state.metric==='density'?'true':'false');
  $('m-length').setAttribute('aria-pressed',state.metric==='length'?'true':'false');
}
function renderAll(){renderShops();renderBoard();renderSel();renderMetric();renderGrid();renderRep();renderMode();}
function toastMsg(t){$('toast').textContent=t;}

function report(lv){
  var shop=shopById(state.shop);
  if(!isOpen(shop,view.day,view.hour))return;
  var key=view.day+'-'+view.hour;
  var c=state.data[shop.id][key];
  if(!c){c=[0,0,0];state.data[shop.id][key]=c;}
  var before=shopTotal(shop.id);
  c[0]+=1;c[1]=+(c[1]+lv).toFixed(3);c[2]+=Math.max(1,Math.round(shop.scale*TYP[lv]));
  save();renderAll();
  toastMsg('「'+LV[lv]+'」を受け取りました。報告'+before+'件 → '+(before+1)+'件。ヒートマップに反映しています。');
}
function askConfirm(kind){
  pending=kind;
  $('confirm-msg').textContent=kind==='clear'
    ?'サンプルの報告をすべて消します。この端末の中だけの操作です。よろしいですか。'
    :'今の報告をすべて消して、サンプルの状態に戻します。よろしいですか。';
  $('confirm').hidden=false;
  $('c-ok').focus();
}
function closeConfirm(){pending=null;$('confirm').hidden=true;}
function runConfirm(){
  if(pending==='clear'){state=emptyState(state);}
  else if(pending==='reset'){var s=sampleState();s.shop=state.shop;s.metric=state.metric;state=s;}
  closeConfirm();save();toastMsg(state.mode==='own'?'サンプルを消しました。':'サンプルに戻しました。');renderAll();
}

function init(){
  var dsel=$('sel-day'),hsel=$('sel-hour');
  DAYS.forEach(function(d,i){var o=document.createElement('option');o.value=String(i);o.textContent=d+'曜';dsel.appendChild(o);});
  HOURS.forEach(function(h){var o=document.createElement('option');o.value=String(h);o.textContent=h+'時台';hsel.appendChild(o);});
  state=load()||sampleState();
  setNow();
  dsel.addEventListener('change',function(){view.day=parseInt(dsel.value,10);toastMsg('');renderAll();});
  hsel.addEventListener('change',function(){view.hour=parseInt(hsel.value,10);toastMsg('');renderAll();});
  $('btn-now').addEventListener('click',function(){setNow();toastMsg('');renderAll();});
  $('m-density').addEventListener('click',function(){state.metric='density';save();renderAll();});
  $('m-length').addEventListener('click',function(){state.metric='length';save();renderAll();});
  for(var k=1;k<=3;k++){$('r-'+k).addEventListener('click',(function(lv){return function(){report(lv);};})(k));}
  $('b-clear').addEventListener('click',function(){askConfirm('clear');});
  $('b-reset').addEventListener('click',function(){askConfirm('reset');});
  $('c-ok').addEventListener('click',runConfirm);
  $('c-cancel').addEventListener('click',closeConfirm);
  renderAll();
}
init();
})();
</script>
</body>
</html>
