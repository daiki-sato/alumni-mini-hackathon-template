<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="claude:viewport-fit-sides" content="cover">
<title>テイネイホンヤク</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@500;700&family=Noto+Sans+JP:wght@400;500;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
:root{
  --bg:#F1F3EF; --surface:#FFFFFF; --ink:#1A2320; --muted:#5E6B66; --line:#D9DED9;
  --signal:#E3A008; --signal-ink:#5A3E00; --ok:#2F7D6D; --ng:#C8512F; --board:#1F2A26; --board-ink:#F6C343;
  --font-display:"Zen Kaku Gothic New","Hiragino Sans","Noto Sans JP",sans-serif;
  --font-body:"Noto Sans JP","Hiragino Sans",sans-serif;
  --font-mono:"IBM Plex Mono",ui-monospace,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#111614; --surface:#1A201D; --ink:#E6ECE8; --muted:#9AA7A1; --line:#2C3531;
  --signal:#F2B632; --signal-ink:#2A1D00; --ok:#5FB8A3; --ng:#EE7C5A; --board:#0B0F0D; --board-ink:#F6C343; color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#111614; --surface:#1A201D; --ink:#E6ECE8; --muted:#9AA7A1; --line:#2C3531;
  --signal:#F2B632; --signal-ink:#2A1D00; --ok:#5FB8A3; --ng:#EE7C5A; --board:#0B0F0D; --board-ink:#F6C343; color-scheme:dark;}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);margin:0}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{font-size:15px;line-height:1.7}
.outer{padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));padding-top:12px;padding-bottom:48px}
.wrap{max-width:560px;margin:0 auto}
.back{display:inline-block;color:var(--muted);font-size:13px;text-decoration:none;padding:6px 0}
.back:hover{text-decoration:underline}
h1{font-family:var(--font-display);font-size:24px;line-height:1.3;margin:6px 0 10px}
h2{font-family:var(--font-display);font-size:16px;margin:24px 0 8px}
p{margin:0 0 8px}
.hyp{border:1px solid var(--line);border-radius:8px;padding:10px 12px;background:var(--surface);font-size:12.5px;line-height:1.6;color:var(--muted);margin-bottom:14px}
.hyp-tags{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:6px}
.hyp-tags span{border:1px solid var(--line);border-radius:8px;padding:0 8px;font-size:11.5px;color:var(--muted)}
.hyp-h{color:var(--ink);font-weight:500;margin:0 0 6px}
.hyp-c{margin:0 0 4px}
.hyp-c b,.hyp-j b{display:inline-block;margin-right:6px;color:var(--ink)}
.hyp-j{list-style:none;margin:0;padding:0}
.hyp-j li{margin:2px 0}
.hyp-j .ok b{color:var(--ok)}
.hyp-j .ng b{color:var(--ng)}
.board{background:var(--board);color:var(--board-ink);border-radius:8px;padding:14px 16px;font-family:var(--font-mono)}
.board .lab{font-family:var(--font-body);font-size:12px;opacity:.85;color:var(--board-ink)}
.board .big{font-size:46px;font-weight:600;line-height:1.1;font-variant-numeric:tabular-nums;letter-spacing:.02em}
.board .sub{font-family:var(--font-body);font-size:13px;margin-top:4px;color:var(--board-ink);opacity:.9}
.mono{font-family:var(--font-mono);font-variant-numeric:tabular-nums}
.btn{font:inherit;font-weight:500;min-height:44px;padding:8px 14px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer}
.btn:hover{border-color:var(--muted)}
.btn[aria-pressed="true"]{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink);font-weight:700}
.btn.primary{background:var(--signal);color:var(--signal-ink);border-color:var(--signal);font-weight:700}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.sm{min-height:36px;padding:4px 10px;font-size:13px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.row.grow>.btn{flex:1 1 auto}
.panel{border:1px solid var(--line);border-radius:8px;background:var(--surface);padding:12px 14px;margin:10px 0}
.muted{color:var(--muted)}
.small{font-size:12.5px}
:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
input[type=text],textarea,select{font:inherit;width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink)}
textarea{resize:vertical;min-height:90px}
input[type=range]{width:100%;accent-color:var(--ink)}
label{display:block;font-size:13px;color:var(--muted);margin:6px 0 2px}
.ok-t{color:var(--ok);font-weight:700}
.ng-t{color:var(--ng);font-weight:700}
.sample{margin-top:32px;padding-top:14px;border-top:1px solid var(--line);font-size:12.5px;color:var(--muted)}
.sample .row{margin:8px 0}
.confirm{border:1px solid var(--ng);border-radius:8px;padding:10px 12px;background:var(--surface);color:var(--ink);margin-top:8px}
.bar{height:10px;border-radius:5px;background:var(--line);overflow:hidden}
.bar>i{display:block;height:100%;background:var(--ink)}
@media (prefers-reduced-motion: no-preference){.bar>i{transition:width .25s}}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}

.pair{display:grid;grid-template-columns:1fr;gap:8px}
@media (min-width:480px){.pair{grid-template-columns:1fr 1fr}}
.msgbox{border:1px solid var(--line);border-radius:8px;background:var(--surface);padding:10px 12px;white-space:pre-wrap;word-break:break-word;font-size:14px;min-height:96px}
.msgbox.fixed{border-color:var(--ink)}
.msgbox .t{display:block;font-size:11.5px;color:var(--muted);margin-bottom:4px;white-space:normal}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.tags span{border:1px solid var(--line);border-radius:8px;padding:0 8px;font-size:12px;color:var(--muted)}
.rt{display:grid;grid-template-columns:1fr 44px;gap:8px;align-items:center}
.rt output{font-family:var(--font-mono);font-size:20px;text-align:right;font-variant-numeric:tabular-nums}
table.lg{border-collapse:collapse;width:100%;font-size:13px}
table.lg td,table.lg th{border-bottom:1px solid var(--line);padding:4px 6px;text-align:left}
</style>
</head>
<body>
<div class="outer"><div class="wrap">
<a class="back" href="./">← 50の仮説</a>
<section class="hyp" aria-label="仮説カード">
<div class="hyp-tags"><span>視点 行列以外の悩み</span><span>具体</span></div>
<p class="hyp-h">不快なのは内容ではなく形式（あいさつなし・雑さ）。受け取る側で形式を整えれば不快は減る。</p>
<p class="hyp-c"><b>確かめること</b></p>
<ul class="hyp-j"><li class="ok"><b>当たり</b>整えた文で読むと嫌さが減る</li><li class="ng"><b>外れ</b>内容が同じなら整えても嫌</li></ul>
</section>
<h1>テイネイホンヤク</h1>

<div class="board" aria-live="polite">
  <div class="lab">嫌さの差（元 − 整えた後）</div>
  <div class="big" id="b-diff">0</div>
  <div class="sub" id="b-sub">元 5 → 整えた後 5</div>
</div>

<h2>1. 雑なメッセージを選ぶか貼る</h2>
<label for="sel">例（すべて架空）</label>
<select id="sel"></select>
<label for="txt">貼り付け・編集（1行ずつ別のメッセージとして扱います）</label>
<textarea id="txt" rows="4"></textarea>
<p class="small muted">外部には送られません。言いかえは、この画面の中のルールだけで作っています。</p>

<h2>2. 受け取る側の画面で並べる</h2>
<div class="pair">
  <div class="msgbox" id="out-raw" aria-label="元のメッセージ"></div>
  <div class="msgbox fixed" id="out-fixed" aria-label="整えたメッセージ"></div>
</div>
<div class="tags" id="tags"></div>

<h2>3. 嫌さを0〜10で付ける</h2>
<label for="rt-raw">元の文を読んだとき</label>
<div class="rt"><input type="range" id="rt-raw" min="0" max="10" step="1" value="5"><output id="o-raw" for="rt-raw">5</output></div>
<label for="rt-fixed">整えた文を読んだとき</label>
<div class="rt"><input type="range" id="rt-fixed" min="0" max="10" step="1" value="5"><output id="o-fixed" for="rt-fixed">5</output></div>
<div class="row" style="margin-top:10px"><button class="btn primary" id="btn-save" type="button">この2つの点を記録に入れる</button><span class="small muted" id="save-st" role="status"></span></div>

<h2>これまでの記録</h2>
<p class="small" id="sum"></p>
<table class="lg" id="lg"></table>

<footer class="sample">
<p id="sample-note">サンプルデータ（架空）で動いています。</p>
<div class="row"><button class="btn sm" id="btn-clear" type="button">サンプルを消して自分で使う</button><button class="btn sm" id="btn-reset" type="button">サンプルに戻す</button></div>
<div class="confirm" id="confirm" role="alertdialog" aria-live="polite" hidden><p id="confirm-msg"></p><div class="row"><button class="btn sm primary" id="confirm-yes" type="button">実行する</button><button class="btn sm" id="confirm-no" type="button">やめる</button></div></div>
</footer>
</div></div>
<script>
(function(){
function $(id){return document.getElementById(id)}
function esc(s){return String(s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
var KEY='hack3-g9-3-v1';
function loadState(){try{var s=localStorage.getItem(KEY);return s?JSON.parse(s):null}catch(e){return null}}
function saveState(o){try{localStorage.setItem(KEY,JSON.stringify(o))}catch(e){}}
function setNote(isSample){$('sample-note').textContent=isSample?'サンプルデータ（架空）で動いています。':'あなたのデータで動いています。'}
var confirmFn=null;
function showConfirm(msg,fn){confirmFn=fn;$('confirm-msg').textContent=msg;$('confirm').hidden=false;$('confirm-yes').focus()}

var SAMPLES=[
 {label:'状況を聞く連投',text:'これどうなってる？\nまだ？\n明日までにいける？'},
 {label:'資料と確認の依頼',text:'資料送って\nあと、昨日の件どうなった？'},
 {label:'理由を問う',text:'なんでこうなったの？\n確認しといて'},
 {label:'会議の質問',text:'ちょっと聞きたいんだけど\n今日の会議っていつ？\nあと場所も'}
];
var RULES=[
 [/^これどうなってる[？?]*$/,function(){return 'こちらの件、現在の状況を教えていただけますか。'}],
 [/^まだ[？?]*$/,function(){return '進捗はいかがでしょうか。'}],
 [/^(.+?)までにいける[？?]*$/,function(m){return m[1]+'までにご対応いただくことは可能でしょうか。'}],
 [/^(.+?)送って[。！!]*$/,function(m){return m[1]+'をお送りいただけますか。'}],
 [/^あと、?(.+?)も$/,function(m){return 'あわせて、'+m[1]+'も教えていただけますか。'}],
 [/^(.+?)どうなった[？?]*$/,function(m){return m[1].replace(/^あと、?/,'')+'について、その後の状況を教えていただけますか。'}],
 [/^なんで(.+?)の?[？?]+$/,function(m){return m[1]+'経緯を教えていただけますか。'}],
 [/^(.*?)確認しといて[。！!]*$/,function(m){return (m[1]?m[1]+'を':'')+'ご確認いただけますか。'}],
 [/^ちょっと聞きたいんだけど[。]*$/,function(){return '1点お尋ねしたいことがあります。'}],
 [/^(.+?)っていつ[？?]*$/,function(m){return m[1]+'はいつでしょうか。'}],
 [/^(.+?)して[。！!]*$/,function(m){return m[1]+'していただけますか。'}]
];
function polish(raw){
 var lines=raw.split(/\n/).map(function(s){return s.trim()}).filter(Boolean);
 if(!lines.length)return {text:'',tags:[]};
 var changed=0;
 var body=lines.map(function(l){
  for(var i=0;i<RULES.length;i++){var m=l.match(RULES[i][0]);if(m){changed++;return RULES[i][1](m)}}
  if(/[？?]$/.test(l)){changed++;return l.replace(/[？?]+$/,'')+'でしょうか。'}
  return /[。.!！]$/.test(l)?l:l+'。';
 });
 var out='お疲れさまです。\n';
 if(body.length>1){body.forEach(function(b,i){out+=(i+1)+'. '+b+'\n'})}
 else out+=body[0]+'\n';
 out+='お忙しいところ恐れ入ります。ご確認のほど、よろしくお願いいたします。';
 return {text:out,tags:['あいさつを足した','本文を丁寧な言い方にした（'+changed+'/'+lines.length+'行）','締めを足した','内容は変えていない']};
}
function sampleState(){return {idx:0,text:SAMPLES[0].text,raw:7,fixed:4,sample:true,log:[
 {head:'これどうなってる？',raw:7,fixed:3},{head:'資料送って',raw:6,fixed:2},{head:'なんでこうなったの？',raw:8,fixed:7},{head:'ちょっと聞きたいんだけど',raw:5,fixed:5}]}}
var S;
function renderBoard(){
 var d=S.raw-S.fixed;
 $('b-diff').textContent=(d>0?'-':(d<0?'+':''))+Math.abs(d);
 $('b-sub').textContent='元 '+S.raw+' → 整えた後 '+S.fixed;
}
function renderText(){
 var p=polish(S.text);
 var raw=S.text.split(/\n/).filter(function(s){return s.trim()}).join('\n');
 $('out-raw').innerHTML='<span class="t">元のメッセージ</span>'+esc(raw||'（空です）');
 $('out-fixed').innerHTML='<span class="t">整えた表示</span>'+esc(p.text||'（空です）');
 $('tags').innerHTML=p.tags.map(function(t){return '<span>'+esc(t)+'</span>'}).join('');
}
function renderLog(){
 var h='<tr><th>メッセージの頭</th><th>元</th><th>整えた後</th></tr>';
 var a=0,b=0;
 S.log.forEach(function(r){a+=r.raw;b+=r.fixed});
 S.log.slice(-6).reverse().forEach(function(r){h+='<tr><td>'+esc(r.head)+'</td><td class="mono">'+r.raw+'</td><td class="mono">'+r.fixed+'</td></tr>'});
 $('lg').innerHTML=h;
 if(S.log.length){
  var n=S.log.length,ar=a/n,br=b/n;
  $('sum').textContent=n+'件の平均: 元 '+ar.toFixed(1)+' → 整えた後 '+br.toFixed(1)+'（差 '+(ar-br).toFixed(1)+'）。'+(ar-br<1?'差が小さく、内容が同じなら整えても嫌、の側に近い数字です。':'');
  var same=S.log.filter(function(r){return r.raw-r.fixed<=1}).length;
  if(same&&ar-br>=1)$('sum').textContent+=' 差が1以下だった文が'+same+'件あります。';
 }else $('sum').textContent='記録が入ると、平均を出します。';
}
function renderSel(){
 var h='<option value="-1">（貼り付けた文）</option>';
 SAMPLES.forEach(function(s,i){h+='<option value="'+i+'">'+esc(s.label)+'</option>'});
 $('sel').innerHTML=h;
 $('sel').value=String(S.idx);
}
function renderAll(){
 renderSel();$('txt').value=S.text;
 $('rt-raw').value=S.raw;$('rt-fixed').value=S.fixed;
 $('o-raw').textContent=S.raw;$('o-fixed').textContent=S.fixed;
 renderText();renderBoard();renderLog();setNote(S.sample);
}
function touch(){S.sample=false;setNote(false);saveState(S)}
function doClear(){S=sampleState();S.idx=-1;S.text='';S.raw=5;S.fixed=5;S.log=[];S.sample=false;saveState(S);renderAll()}
function doReset(){S=sampleState();saveState(S);renderAll()}
function init(){
 S=loadState();
 if(!S||!S.log||typeof S.text!=='string')S=sampleState();
 $('sel').addEventListener('change',function(){
  var i=parseInt($('sel').value,10);S.idx=i;
  if(i>=0){S.text=SAMPLES[i].text;$('txt').value=S.text}
  saveState(S);renderText();
 });
 $('txt').addEventListener('input',function(){S.text=$('txt').value;S.idx=-1;$('sel').value='-1';touch();renderText()});
 $('rt-raw').addEventListener('input',function(){S.raw=parseInt($('rt-raw').value,10);$('o-raw').textContent=S.raw;saveState(S);renderBoard()});
 $('rt-fixed').addEventListener('input',function(){S.fixed=parseInt($('rt-fixed').value,10);$('o-fixed').textContent=S.fixed;saveState(S);renderBoard()});
 $('btn-save').addEventListener('click',function(){
  var head=(S.text.split(/\n/)[0]||'（空）').slice(0,16);
  S.log.push({head:head,raw:S.raw,fixed:S.fixed});
  if(S.log.length>40)S.log.shift();
  touch();renderLog();$('save-st').textContent='記録に入れました（'+S.log.length+'件）';
 });
 renderAll();
}

$('btn-clear').addEventListener('click',function(){showConfirm('サンプルを消して、空の状態から使います。',doClear)});
$('btn-reset').addEventListener('click',function(){showConfirm('サンプルの状態に戻します。入力した内容は消えます。',doReset)});
$('confirm-yes').addEventListener('click',function(){$('confirm').hidden=true;var f=confirmFn;confirmFn=null;if(f)f()});
$('confirm-no').addEventListener('click',function(){$('confirm').hidden=true;confirmFn=null});
init();
})();
</script>
</body>
</html>
