<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="claude:viewport-fit-sides" content="cover">
<title>ツメラレログ</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@500;700&family=Noto+Sans+JP:wght@400;500;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
:root{
  --bg:#F1F3EF; --surface:#FFFFFF; --ink:#1A2320; --muted:#5E6B66; --line:#D9DED9;
  --signal:#E3A008; --signal-ink:#5A3E00; --ok:#2F7D6D; --ng:#C8512F; --board:#1F2A26; --board-ink:#F6C343;
  --font-display:"Zen Kaku Gothic New","Hiragino Sans","Noto Sans JP",sans-serif;
  --font-body:"Noto Sans JP","Hiragino Sans",sans-serif;
  --font-mono:"IBM Plex Mono",ui-monospace,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#111614; --surface:#1A201D; --ink:#E6ECE8; --muted:#9AA7A1; --line:#2C3531;
  --signal:#F2B632; --signal-ink:#2A1D00; --ok:#5FB8A3; --ng:#EE7C5A; --board:#0B0F0D; --board-ink:#F6C343; color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#111614; --surface:#1A201D; --ink:#E6ECE8; --muted:#9AA7A1; --line:#2C3531;
  --signal:#F2B632; --signal-ink:#2A1D00; --ok:#5FB8A3; --ng:#EE7C5A; --board:#0B0F0D; --board-ink:#F6C343; color-scheme:dark;}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);margin:0}
*{box-sizing:border-box}
.wrap{max-width:560px;margin:0 auto;padding:12px max(16px, env(safe-area-inset-left, 0px)) 120px;padding-right:max(16px, env(safe-area-inset-right, 0px))}
a{color:var(--ink)}
.back{display:inline-block;font-size:14px;margin-bottom:10px;padding:4px 0}
h1{font-family:var(--font-display);font-size:24px;margin:0 0 6px;font-weight:700}
h2{font-family:var(--font-display);font-size:17px;margin:20px 0 8px;font-weight:700}
.hyp{border-left:4px solid var(--signal);padding:6px 0 6px 10px;margin:8px 0 14px;font-size:14px;line-height:1.6}
.hyp b{font-family:var(--font-display)}
.sample-note{font-size:12px;color:var(--muted);margin:0 0 10px}
.tabs{display:flex;gap:0;border:1px solid var(--line);border-radius:8px;overflow:hidden;margin:0 0 14px;background:var(--surface)}
.tabs button{flex:1;min-height:44px;border:0;background:transparent;color:var(--ink);font:500 15px var(--font-body);cursor:pointer}
.tabs button[aria-selected="true"]{background:var(--signal);color:var(--signal-ink);font-weight:700}
button{font-family:var(--font-body)}
:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
.board :focus-visible,.board-chip:focus-visible{outline-color:var(--board-ink)}
.stores{display:grid;gap:10px}
.store{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:stretch}
.tap{min-height:72px;border:2px solid var(--ink);border-radius:8px;background:var(--surface);color:var(--ink);text-align:left;padding:10px 14px;cursor:pointer;touch-action:manipulation;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.tap:active{background:var(--signal);color:var(--signal-ink)}
.tap .nm{display:block;font:700 18px var(--font-display)}
.tap .sub{display:block;font-size:12px;color:var(--muted);margin-top:2px}
.tap:active .sub{color:var(--signal-ink)}
.fine{min-width:92px;min-height:72px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font-size:13px;line-height:1.4;cursor:pointer;padding:6px;touch-action:manipulation}
.help{font-size:12px;color:var(--muted);margin:10px 0 0;line-height:1.6}
.toast{position:fixed;left:0;right:0;bottom:max(12px, env(safe-area-inset-bottom, 0px));display:flex;justify-content:center;padding:0 max(16px, env(safe-area-inset-left, 0px));pointer-events:none}
.toast .in{pointer-events:auto;max-width:528px;width:100%;background:var(--board);color:var(--board-ink);border-radius:8px;padding:8px 8px 8px 14px;display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:14px}
.toast[hidden]{display:none}
.toast button{min-height:40px;padding:0 14px;border:1px solid var(--board-ink);background:transparent;color:var(--board-ink);border-radius:8px;font-size:14px;cursor:pointer}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 12px}
.chip{min-height:44px;padding:0 14px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink);font-size:14px;cursor:pointer}
.chip[aria-pressed="true"]{border:2px solid var(--ink);font-weight:700}
.board{background:var(--board);color:var(--board-ink);border-radius:8px;padding:14px 14px 12px;margin:0 0 14px}
.board .lead{font-size:12px;opacity:.85;margin:0 0 6px}
.board .big{font-family:var(--font-mono);font-variant-numeric:tabular-nums;font-weight:600;font-size:34px;line-height:1.2;margin:0}
.board .big small{font-size:14px}
.board .row{font-family:var(--font-mono);font-variant-numeric:tabular-nums;font-weight:600;font-size:18px;margin:8px 0 0;line-height:1.5}
.board .row span.k{display:block;font:500 12px var(--font-body);opacity:.85}
.board .few{font-size:15px;line-height:1.7;margin:4px 0 0}
.board .few .num{font-family:var(--font-mono);font-variant-numeric:tabular-nums;font-weight:600;font-size:22px}
.grid{width:100%;border-collapse:collapse;table-layout:fixed;font-family:var(--font-mono);font-variant-numeric:tabular-nums;font-size:12px}
.grid th{font-weight:500;color:var(--muted);padding:3px 0;font-size:12px}
.grid th.rh{text-align:right;padding-right:6px;width:40px}
.grid td{height:28px;border:1px solid var(--line);text-align:center;position:relative;padding:0}
.grid td i{position:absolute;inset:0;background:var(--ng);display:block}
.grid td b{position:relative;font-weight:600;color:var(--ink)}
.grid .we{color:var(--ink)}
.small{font-size:12px;color:var(--muted);line-height:1.6;margin:8px 0 0}
.panel{border-top:1px solid var(--line);margin-top:22px;padding-top:12px}
.panel .btns{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}
.btn{min-height:44px;padding:0 14px;border:1px solid var(--ink);border-radius:8px;background:var(--surface);color:var(--ink);font-size:14px;cursor:pointer}
.btn.main{background:var(--signal);color:var(--signal-ink);border-color:var(--signal-ink);font-weight:700}
.confirm{border:1px solid var(--ng);border-radius:8px;padding:10px 12px;margin:8px 0;font-size:14px;line-height:1.6}
.confirm[hidden]{display:none}
.field{display:flex;gap:8px;margin:8px 0}
.field input{flex:1;min-width:0;min-height:44px;border:1px solid var(--line);border-radius:8px;padding:0 10px;background:var(--surface);color:var(--ink);font:16px var(--font-body)}
.empty{font-size:14px;color:var(--muted);line-height:1.7;border:1px dashed var(--line);border-radius:8px;padding:12px}
@media (prefers-reduced-motion: no-preference){.tap{transition:background .12s}}
@media (prefers-reduced-motion: reduce){*{transition:none !important;animation:none !important}}
</style>
</head>
<body>
<div class="wrap">
  <a class="back" href="./">← 50の仮説</a>
  <h1>ツメラレログ</h1>
  <p class="hyp"><b>確かめたい仮説</b><br>自分のデータから出た数字なら、指示ではなく参考値として受け入れて、行く時間を変える。</p>
  <p class="sample-note" id="sample-note" hidden>表示中はサンプルデータです（架空の店・過去3か月ぶん）。</p>

  <div class="tabs" role="tablist">
    <button type="button" role="tab" id="tab-log" aria-selected="true" aria-controls="view-log">記録</button>
    <button type="button" role="tab" id="tab-an" aria-selected="false" aria-controls="view-an">分析</button>
  </div>

  <section id="view-log" role="tabpanel" aria-labelledby="tab-log">
    <div class="stores" id="stores"></div>
    <p class="help">詰められた瞬間に、店のボタンを1回押します。日時は自動です。「平気だった」ボタン（またはボタンの長押し）は、詰められなかった並びの記録で、比べるための任意の記録です。</p>

    <div class="panel" id="settings">
      <h2 style="margin-top:0">データ</h2>
      <p class="small" id="count-line"></p>
      <div class="btns">
        <button type="button" class="btn" id="clear-sample-btn">サンプルを消して自分で使う</button>
        <button type="button" class="btn" id="restore-sample-btn">サンプルに戻す</button>
      </div>
      <div class="confirm" id="confirm-box" hidden>
        <p id="confirm-text" style="margin:0 0 8px"></p>
        <div class="btns" style="margin:0">
          <button type="button" class="btn main" id="confirm-yes">実行する</button>
          <button type="button" class="btn" id="confirm-no">やめる</button>
        </div>
      </div>
      <div class="field">
        <input id="store-name-input" type="text" maxlength="20" placeholder="店の名前（例: 駅前ラーメン）" aria-label="追加する店の名前">
        <button type="button" class="btn" id="add-store-btn">店を追加</button>
      </div>
      <p class="small" id="add-msg" role="status"></p>
    </div>
  </section>

  <section id="view-an" role="tabpanel" aria-labelledby="tab-an" hidden>
    <div class="chips" id="store-chips"></div>
    <div id="an-body"></div>
  </section>
</div>

<div class="toast" id="toast" hidden>
  <div class="in" role="status" aria-live="polite">
    <span id="toast-text"></span>
    <button type="button" id="undo-btn">取り消す</button>
  </div>
</div>

<script>
(function(){
  var KEY='hack-tsumerare-v1';
  var DOW=['日','月','火','水','木','金','土'];
  var COLS=[1,2,3,4,5,6,0];
  var H0=10,H1=20;
  var MIN_PUSHED=10;
  var state={stores:[],records:[],sample:true};
  var selStore=null;
  var undoId=null,undoTimer=null,pendingAction=null;

  function $(id){return document.getElementById(id);}
  function load(){
    try{var s=localStorage.getItem(KEY);if(s){var o=JSON.parse(s);if(o&&o.stores&&o.records){return o;}}}catch(e){}
    return null;
  }
  function save(){try{localStorage.setItem(KEY,JSON.stringify(state));}catch(e){}}
  function uid(){return 'r'+Date.now().toString(36)+Math.random().toString(36).slice(2,7);}

  function makeRng(seed){var a=seed;return function(){a|=0;a=a+0x6D2B79F5|0;var t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
  function pickW(rng,items){var tot=0,i;for(i=0;i<items.length;i++)tot+=items[i][1];var r=rng()*tot;for(i=0;i<items.length;i++){r-=items[i][1];if(r<=0)return items[i][0];}return items[items.length-1][0];}
  function dateAt(dow,weeksAgo,hour,min){
    var d=new Date();d.setHours(hour,min,0,0);
    var diff=(d.getDay()-dow+7)%7;if(diff===0)diff=7;
    d.setDate(d.getDate()-diff-7*weeksAgo);
    return d.getTime();
  }
  function makeSample(){
    var rng=makeRng(20261017);
    var stores=[
      {id:'s1',name:'麺屋 青空（ラーメン）'},
      {id:'s2',name:'中華そば 灯（ラーメン）'},
      {id:'s3',name:'らーめん 一歩（ラーメン）'},
      {id:'s4',name:'つけ麺 風雅'}
    ];
    var counts={s1:12,s2:10,s3:8,s4:5};
    var dowW=[[6,4],[0,2.5],[1,.4],[2,.4],[3,.4],[4,.4],[5,.6]];
    var hrWe=[[11,2],[12,10],[13,4],[14,.3],[15,.3],[17,.4],[18,.5]];
    var hrWd=[[11,.7],[12,2],[13,1.5],[18,1],[19,.8]];
    var recs=[];
    stores.forEach(function(st){
      var n=counts[st.id],i;
      for(i=0;i<n;i++){
        var dow=pickW(rng,dowW);
        var we=(dow===0||dow===6);
        var hr=pickW(rng,we?hrWe:hrWd);
        recs.push({id:uid()+i,storeId:st.id,ts:dateAt(dow,Math.floor(rng()*12),hr,Math.floor(rng()*60)),type:'pushed'});
      }
      var okSpec=[[2,14],[3,14],[4,11],[0,15]];
      okSpec.forEach(function(sp,j){
        recs.push({id:uid()+'o'+j,storeId:st.id,ts:dateAt(sp[0],Math.floor(rng()*10),sp[1],Math.floor(rng()*60)),type:'ok'});
      });
    });
    recs.sort(function(a,b){return a.ts-b.ts;});
    return {stores:stores,records:recs,sample:true};
  }

  function storeById(id){for(var i=0;i<state.stores.length;i++)if(state.stores[i].id===id)return state.stores[i];return null;}
  function countOf(id,type){var n=0;state.records.forEach(function(r){if(r.storeId===id&&r.type===type)n++;});return n;}

  /* ---------- 記録画面 ---------- */
  function el(tag,cls,text){var e=document.createElement(tag);if(cls)e.className=cls;if(text!=null)e.textContent=text;return e;}

  function renderStores(){
    var box=$('stores');box.textContent='';
    if(!state.stores.length){box.appendChild(el('p','empty','店がまだありません。下の「店を追加」から、よく行く店を入れてください。'));return;}
    state.stores.forEach(function(st){
      var row=el('div','store');
      var main=el('button','tap');main.type='button';main.id='tap-'+st.id;main.setAttribute('data-store',st.id);
      var nm=el('span','nm',st.name);var sub=el('span','sub','');sub.id='sub-'+st.id;
      main.appendChild(nm);main.appendChild(sub);
      main.setAttribute('aria-label',st.name+' 詰められた（1回押すと記録）');
      var fine=el('button','fine','並んだけど平気だった');fine.type='button';fine.id='ok-'+st.id;
      var timer=null,fired=false;
      function clear(){if(timer){clearTimeout(timer);timer=null;}}
      main.addEventListener('pointerdown',function(){fired=false;clear();timer=setTimeout(function(){fired=true;timer=null;record(st.id,'ok');},650);});
      main.addEventListener('pointerup',clear);main.addEventListener('pointerleave',clear);main.addEventListener('pointercancel',clear);
      main.addEventListener('contextmenu',function(e){e.preventDefault();});
      main.addEventListener('click',function(){if(fired){fired=false;return;}record(st.id,'pushed');});
      fine.addEventListener('click',function(){record(st.id,'ok');});
      row.appendChild(main);row.appendChild(fine);box.appendChild(row);
    });
    updateCounts();
  }
  function updateCounts(){
    state.stores.forEach(function(st){
      var s=$('sub-'+st.id);if(s)s.textContent='詰められた '+countOf(st.id,'pushed')+'回 ／ 平気 '+countOf(st.id,'ok')+'回';
    });
    var t=state.records.length;
    $('count-line').textContent='記録は全部で'+t+'件'+(state.sample?'（サンプル）':'')+'。このブラウザの中にだけ保存されます。';
    $('sample-note').hidden=!state.sample;
  }

  function record(storeId,type){
    var r={id:uid(),storeId:storeId,ts:Date.now(),type:type};
    state.records.push(r);save();updateCounts();
    undoId=r.id;
    var st=storeById(storeId);
    showToast('記録しました: '+(st?st.name:'')+(type==='ok'?'（平気だった）':'（詰められた）'));
  }
  function showToast(msg){
    $('toast-text').textContent=msg;$('toast').hidden=false;
    if(undoTimer)clearTimeout(undoTimer);
    undoTimer=setTimeout(hideToast,6000);
  }
  function hideToast(){$('toast').hidden=true;undoId=null;if(undoTimer){clearTimeout(undoTimer);undoTimer=null;}}
  function undo(){
    if(!undoId)return;
    var id=undoId;
    state.records=state.records.filter(function(r){return r.id!==id;});
    save();updateCounts();
    $('toast-text').textContent='取り消しました';undoId=null;
    if(undoTimer)clearTimeout(undoTimer);
    undoTimer=setTimeout(hideToast,2000);
    if(!$('view-an').hidden)renderAnalysis();
  }

  /* ---------- 分析 ---------- */
  function hourClamp(h){return Math.min(H1,Math.max(H0,h));}
  function analyze(storeId){
    var cell={},pushed=0,ok=0;
    var grp={};/* key g|h -> {p,o} */
    state.records.forEach(function(r){
      if(r.storeId!==storeId)return;
      var d=new Date(r.ts),dow=d.getDay(),h=hourClamp(d.getHours());
      var g=(dow===0||dow===6)?'we':'wd';
      var gk=g+'|'+h;grp[gk]=grp[gk]||{p:0,o:0,g:g,h:h};
      if(r.type==='pushed'){pushed++;var k=dow+'|'+h;cell[k]=(cell[k]||0)+1;grp[gk].p++;}
      else{ok++;grp[gk].o++;}
    });
    var top=null;
    Object.keys(cell).forEach(function(k){var v=cell[k];if(!top||v>top.n){var p=k.split('|');top={dow:+p[0],h:+p[1],n:v};}});
    var low=null;
    Object.keys(grp).forEach(function(k){
      var x=grp[k],tot=x.p+x.o;if(tot<2)return;
      var ratio=x.p/tot;
      if(!low||ratio<low.ratio||(ratio===low.ratio&&tot>low.tot)){low={g:x.g,h:x.h,p:x.p,tot:tot,ratio:ratio};}
    });
    var max=0;Object.keys(cell).forEach(function(k){if(cell[k]>max)max=cell[k];});
    return {cell:cell,pushed:pushed,ok:ok,top:top,low:low,max:max};
  }

  function renderChips(){
    var box=$('store-chips');box.textContent='';
    state.stores.forEach(function(st){
      var b=el('button','chip',st.name);b.type='button';b.id='chip-'+st.id;
      b.setAttribute('aria-pressed',st.id===selStore?'true':'false');
      b.addEventListener('click',function(){selStore=st.id;renderChips();renderAnalysis();});
      box.appendChild(b);
    });
  }
  function renderAnalysis(){
    var body=$('an-body');body.textContent='';
    if(!state.stores.length){body.appendChild(el('p','empty','店がまだありません。「記録」画面で店を追加してください。'));return;}
    if(!storeById(selStore))selStore=state.stores[0].id;
    var st=storeById(selStore),a=analyze(selStore);
    var board=el('div','board');board.id='board';
    board.appendChild(el('p','lead',st.name));
    var big=el('p','big',String(a.pushed));
    var sm=el('small',null,' 回 詰められた');big.appendChild(sm);board.appendChild(big);
    if(a.pushed<MIN_PUSHED){
      var need=MIN_PUSHED-a.pushed;
      board.appendChild(el('p','few','記録'+a.pushed+'件。参考にするにはあと'+need+'件くらい。'));
      var f2=el('p','lead','数字が少ないうちは、偶然のかたよりかもしれません。');f2.style.marginTop='6px';board.appendChild(f2);
    }else{
      var r1=el('p','row','');r1.appendChild(el('span','k','あなたの記録では、詰められやすいのは'));
      if(a.top){r1.appendChild(document.createTextNode(DOW[a.top.dow]+' '+a.top.h+'時台（'+a.pushed+'回中'+a.top.n+'回）'));}
      board.appendChild(r1);
      var r2=el('p','row','');r2.appendChild(el('span','k','少ないのは'));
      if(a.low){r2.appendChild(document.createTextNode((a.low.g==='wd'?'平日':'土日')+' '+a.low.h+'時台（記録'+a.low.tot+'件中、詰められ'+a.low.p+'回）'));}
      else{r2.appendChild(document.createTextNode('まだ比べる記録が足りません'));}
      board.appendChild(r2);
      var f3=el('p','lead','参考値です。行く時間は自分で決められます。');f3.style.margin='10px 0 0';board.appendChild(f3);
    }
    body.appendChild(board);

    body.appendChild(el('h2',null,'曜日と時間帯ごとの、詰められた回数'));
    var tbl=el('table','grid');tbl.setAttribute('aria-label',st.name+'の曜日×時間帯の回数');
    var thead=el('thead');var trh=el('tr');trh.appendChild(el('th','rh',''));
    COLS.forEach(function(d){var th=el('th',null,DOW[d]);th.scope='col';trh.appendChild(th);});
    thead.appendChild(trh);tbl.appendChild(thead);
    var tb=el('tbody');
    for(var h=H0;h<=H1;h++){
      var tr=el('tr');var rh=el('th','rh',h+'時');rh.scope='row';tr.appendChild(rh);
      COLS.forEach(function(d){
        var n=a.cell[d+'|'+h]||0;var td=el('td');
        if(n>0){var sh=el('i');sh.style.opacity=String(0.2+0.5*(n/Math.max(1,a.max)));td.appendChild(sh);td.appendChild(el('b',null,String(n)));}
        td.setAttribute('aria-label',DOW[d]+'曜 '+h+'時台 '+n+'回');
        tr.appendChild(td);
      });
      tb.appendChild(tr);
    }
    tbl.appendChild(tb);body.appendChild(tbl);
    body.appendChild(el('p','small','色が濃いほど回数が多い時間帯です。行は「その時刻の1時間」で、10時より前は10時、20時より後は20時に入れています。「平気だった」の記録は、このマス目の数には入れず、「少ないのは」の比べ方にだけ使っています（現在 '+a.ok+'件）。'));
  }

  /* ---------- 画面切り替え・設定 ---------- */
  function showTab(which){
    var log=(which==='log');
    $('view-log').hidden=!log;$('view-an').hidden=log;
    $('tab-log').setAttribute('aria-selected',log?'true':'false');
    $('tab-an').setAttribute('aria-selected',log?'false':'true');
    if(!log){renderChips();renderAnalysis();}
  }
  function askConfirm(text,fn){
    pendingAction=fn;$('confirm-text').textContent=text;$('confirm-box').hidden=false;
    $('confirm-yes').focus();
  }
  function closeConfirm(){pendingAction=null;$('confirm-box').hidden=true;}

  function init(){
    var s=load();
    state=s||makeSample();
    if(!s)save();
    selStore=state.stores.length?state.stores[0].id:null;
    renderStores();updateCounts();
    $('tab-log').addEventListener('click',function(){showTab('log');});
    $('tab-an').addEventListener('click',function(){showTab('an');});
    $('undo-btn').addEventListener('click',undo);
    $('clear-sample-btn').addEventListener('click',function(){
      askConfirm('サンプルの店と記録をすべて消して、空の状態から始めます。よろしいですか？',function(){
        state={stores:[],records:[],sample:false};selStore=null;save();renderStores();updateCounts();
      });
    });
    $('restore-sample-btn').addEventListener('click',function(){
      askConfirm('今の店と記録をすべて消して、サンプルに戻します。よろしいですか？',function(){
        state=makeSample();selStore=state.stores[0].id;save();renderStores();updateCounts();
      });
    });
    $('confirm-yes').addEventListener('click',function(){var f=pendingAction;closeConfirm();if(f)f();});
    $('confirm-no').addEventListener('click',closeConfirm);
    $('add-store-btn').addEventListener('click',function(){
      var v=$('store-name-input').value.replace(/^\s+|\s+$/g,'');
      var msg=$('add-msg');
      if(!v){msg.textContent='店の名前を入れてください。';return;}
      var id='u'+Date.now().toString(36);
      state.stores.push({id:id,name:v});
      if(!selStore)selStore=id;
      $('store-name-input').value='';
      save();renderStores();updateCounts();msg.textContent='「'+v+'」を追加しました。';
    });
  }
  init();
})();
</script>
</body>
</html>
