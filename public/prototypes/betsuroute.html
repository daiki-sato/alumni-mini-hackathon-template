<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="claude:viewport-fit-sides" content="cover">
<title>ベツルート</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@500;700&family=Noto+Sans+JP:wght@400;500;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
:root{
  --bg:#F1F3EF; --surface:#FFFFFF; --ink:#1A2320; --muted:#5E6B66; --line:#D9DED9;
  --signal:#E3A008; --signal-ink:#5A3E00; --ok:#2F7D6D; --ng:#C8512F; --board:#1F2A26; --board-ink:#F6C343;
  --font-display:"Zen Kaku Gothic New","Hiragino Sans","Noto Sans JP",sans-serif;
  --font-body:"Noto Sans JP","Hiragino Sans",sans-serif;
  --font-mono:"IBM Plex Mono",ui-monospace,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#111614; --surface:#1A201D; --ink:#E6ECE8; --muted:#9AA7A1; --line:#2C3531;
  --signal:#F2B632; --signal-ink:#2A1D00; --ok:#5FB8A3; --ng:#EE7C5A; --board:#0B0F0D; --board-ink:#F6C343; color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#111614; --surface:#1A201D; --ink:#E6ECE8; --muted:#9AA7A1; --line:#2C3531;
  --signal:#F2B632; --signal-ink:#2A1D00; --ok:#5FB8A3; --ng:#EE7C5A; --board:#0B0F0D; --board-ink:#F6C343; color-scheme:dark;}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);margin:0}
*{box-sizing:border-box}
.wrap{max-width:560px;margin:0 auto;padding:16px max(16px, env(safe-area-inset-right, 0px)) 48px max(16px, env(safe-area-inset-left, 0px))}
a{color:var(--ink)}
.back{display:inline-block;font-size:14px;margin-bottom:12px;padding:4px 0}
:focus-visible{outline:3px solid var(--signal);outline-offset:2px}
h1{font-family:var(--font-display);font-size:24px;margin:0 0 8px;line-height:1.3}
h2{font-family:var(--font-display);font-size:17px;margin:24px 0 8px}
.hyp{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--signal);border-radius:8px;padding:10px 12px;font-size:14px;line-height:1.6;margin:0 0 8px}
.hyp b{font-family:var(--font-display)}
.sample-note{font-size:12px;color:var(--muted);margin:0 0 12px}
button{font:inherit;cursor:pointer;min-height:44px}
.btn{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:8px;padding:8px 14px;font-size:14px}
.btn.primary{background:var(--signal);color:var(--signal-ink);border-color:var(--signal);font-weight:700}
.btn.small{min-height:36px;padding:4px 10px;font-size:13px}
.row-btns{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}
.confirm{background:var(--surface);border:1px solid var(--ng);border-radius:8px;padding:10px 12px;margin:8px 0;font-size:14px}
.stores{display:flex;flex-wrap:wrap;gap:8px}
.store{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:8px;padding:8px 12px;text-align:left;font-size:14px;line-height:1.4}
.store[aria-pressed="true"]{border:2px solid var(--ink);font-weight:700}
.store small{display:block;color:var(--muted);font-weight:400;font-size:12px}
.board{background:var(--board);color:var(--board-ink);border-radius:8px;padding:14px 16px;margin:16px 0}
.board .lab{font-size:13px;color:var(--board-ink);opacity:.85}
.board .num{font-family:var(--font-mono);font-variant-numeric:tabular-nums;font-weight:600;font-size:56px;line-height:1.1}
.board .unit{font-size:18px;margin-left:6px;font-family:var(--font-display)}
.board .def{font-size:12px;opacity:.8;margin-top:4px;line-height:1.5}
.formula{font-size:13px;color:var(--muted);line-height:1.7;margin:0 0 8px}
.formula b{color:var(--ink)}
.route{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:12px;margin:0 0 8px}
.route.zero{background:transparent;border-style:dashed}
.route-head{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.route-name{font-family:var(--font-display);font-weight:700;font-size:16px;margin:0}
.route-detail{font-size:13px;color:var(--muted);margin:2px 0 0;line-height:1.5}
.fav{flex:none;min-width:44px;border:1px solid var(--line);background:var(--surface);color:var(--muted);border-radius:8px;padding:4px 8px;font-size:12px}
.fav[aria-pressed="true"]{background:var(--signal);color:var(--signal-ink);border-color:var(--signal);font-weight:700}
.cells{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:10px}
.cell{border-top:3px solid var(--line);padding-top:4px;min-width:0}
.cell .k{font-size:11px;color:var(--muted)}
.cell .v{font-size:13px;font-weight:700;line-height:1.35;overflow-wrap:anywhere}
.cell .v.mono{font-family:var(--font-mono);font-variant-numeric:tabular-nums}
.cell.gate-ok{border-top-color:var(--ok)}
.cell.gate-ng{border-top-color:var(--ng)}
.cell.gate-ng .v{color:var(--ng)}
.cell.gate-ok .v{color:var(--ok)}
.route.zero .cell:not(.gate-ng){opacity:.45}
.answer{font-size:12px;margin-top:8px;color:var(--muted)}
.answer .mono{font-family:var(--font-mono);font-weight:600;color:var(--ink)}
.answer.zero .mono{color:var(--ng)}
.honest{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:12px;font-size:14px;line-height:1.7;margin:8px 0}
.honest p{margin:0 0 6px}
.favs{font-size:14px;line-height:1.7}
.favs ul{margin:4px 0 0;padding-left:20px}
.empty{font-size:13px;color:var(--muted)}
form.add{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:12px;margin:8px 0;display:grid;gap:8px}
form.add label{font-size:13px;display:grid;gap:2px}
form.add input,form.add select{font:inherit;font-size:16px;min-height:44px;padding:6px 8px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);width:100%}
.foot{font-size:12px;color:var(--muted);margin-top:24px;line-height:1.6}
@media (max-width:380px){.cells{grid-template-columns:repeat(2,1fr)}}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
</style>
</head>
<body>
<div class="wrap">
<a class="back" href="./">← 50の仮説</a>
<h1>ベツルート</h1>
<p class="hyp"><b>仮説:</b> 同じ店の味に、並ばずにたどり着く方法があれば、そちらを選ぶ。</p>
<p class="sample-note" id="sampleNote"></p>
<div class="row-btns">
  <button type="button" class="btn small" id="btnOwn">サンプルを消して自分で使う</button>
  <button type="button" class="btn small" id="btnSample">サンプルに戻す</button>
</div>
<div id="confirmArea" aria-live="polite"></div>

<h2>店を選ぶ</h2>
<div class="stores" id="stores" role="group" aria-label="店"></div>
<div id="addStoreArea"></div>

<div id="main"></div>

<h2>お気に入りのルート</h2>
<div class="favs" id="favs"></div>

<p class="foot">ルートは事実を並べたものです。どれを選ぶか、店頭に並ぶかどうかは、そのときの自分で決めます。店名・時間はすべて架空のサンプルです。</p>
</div>
<script>
(function(){
  var KEY='hack-betsuroute-v1';
  var TYPES=['店頭に並ぶ','記帳制・整理券','アプリの順番待ち','通販の冷凍ラーメン','テイクアウト','催事・ポップアップ出店','姉妹店・2号店'];
  var NEAR=['なし','少し','あり'];
  var TASTE=['別物','ほぼ同じ','同じ'];
  var SAMPLE=[
    {id:'s1',name:'麺屋 北の蔵',area:'架空・駅北口',routes:[
      {id:'r1',type:'店頭に並ぶ',wait:90,near:2,taste:2,effort:'なし',detail:'開店前から列。後ろとの間隔は詰まりやすい。'},
      {id:'r2',type:'記帳制・整理券',wait:5,near:1,taste:2,effort:'朝に名前を書く',detail:'朝9時に店前で記帳し、指定の時間帯に来る。'},
      {id:'r3',type:'アプリの順番待ち',wait:20,near:0,taste:2,effort:'アプリで受付',detail:'離れた場所で待ち、呼ばれたら入店。'},
      {id:'r4',type:'通販の冷凍ラーメン',wait:0,near:0,taste:1,effort:'注文して解凍',detail:'スープと麺は店と同じ仕込み。チャーシューは別仕様。'},
      {id:'r5',type:'催事・ポップアップ出店',wait:45,near:2,taste:1,effort:'日程を調べる',detail:'百貨店の催事。限定の一杯のみ。'}
    ]},
    {id:'s2',name:'中華そば 灯',area:'架空・商店街',routes:[
      {id:'r1',type:'店頭に並ぶ',wait:60,near:2,taste:2,effort:'なし',detail:'狭い路地に列ができる。'},
      {id:'r2',type:'記帳制・整理券',wait:10,near:1,taste:2,effort:'朝に整理券を取る',detail:'昼の部は10時に整理券を配布。'},
      {id:'r3',type:'テイクアウト',wait:25,near:1,taste:1,effort:'電話で予約',detail:'持ち帰り用に麺とスープを分けて渡す。'},
      {id:'r4',type:'姉妹店・2号店',wait:10,near:0,taste:2,effort:'移動が少し増える',detail:'同じ店主・同じ味。席数が多く回転が早い。'}
    ]},
    {id:'s3',name:'煮干し 凪',area:'架空・大学前',routes:[
      {id:'r1',type:'店頭に並ぶ',wait:70,near:2,taste:2,effort:'なし',detail:'ピーク時は店内まで列。'},
      {id:'r2',type:'アプリの順番待ち',wait:30,near:0,taste:2,effort:'アプリで受付',detail:'受付は当日分のみ。'},
      {id:'r3',type:'通販の冷凍ラーメン',wait:0,near:0,taste:0,effort:'注文して解凍',detail:'冷凍用は別レシピ。煮干しの香りが店と別物になる。'}
    ]},
    {id:'s4',name:'一杯堂 本店',area:'架空・川沿い',routes:[
      {id:'r1',type:'店頭に並ぶ',wait:80,near:2,taste:2,effort:'なし',detail:'ほかの提供方法はなく、店頭の列のみ。'}
    ]}
  ];
  var state=null;
  var memFallback=null;

  function clone(o){return JSON.parse(JSON.stringify(o));}
  function load(){
    try{var raw=localStorage.getItem(KEY);if(raw){var s=JSON.parse(raw);if(s&&typeof s==='object')return s;}}catch(e){}
    return memFallback?clone(memFallback):null;
  }
  function save(){
    memFallback=clone(state);
    try{localStorage.setItem(KEY,JSON.stringify(state));}catch(e){}
  }
  function fresh(){return {mode:'sample',sel:'s1',favs:{},own:[]};}
  function stores(){return state.mode==='sample'?SAMPLE:state.own;}
  function esc(s){return String(s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
  function curStore(){
    var list=stores();
    for(var i=0;i<list.length;i++){if(list[i].id===state.sel)return list[i];}
    return list[0]||null;
  }
  // 並ばずに同じ味: 列に並ぶ時間が10分以下 かつ 味が別物でない
  function qualifies(r){return r.wait<=10 && r.taste>0;}
  function favKey(s,r){return s.id+':'+r.id;}

  function renderStores(){
    var el=document.getElementById('stores');
    var list=stores();
    var cs=curStore();
    if(!list.length){el.innerHTML='<p class="empty">まだ店がありません。下の欄から追加します。</p>';return;}
    el.innerHTML=list.map(function(s){
      var pressed=cs&&cs.id===s.id;
      return '<button type="button" class="store" data-store="'+esc(s.id)+'" aria-pressed="'+(pressed?'true':'false')+'" id="store-'+esc(s.id)+'">'+esc(s.name)+'<small>'+esc(s.area||'')+'・ルート'+s.routes.length+'本</small></button>';
    }).join('');
  }
  function renderAddStore(){
    var el=document.getElementById('addStoreArea');
    if(state.mode!=='own'){el.innerHTML='';return;}
    el.innerHTML='<form class="add" id="formStore"><label for="inStoreName">店の名前（自分で呼べる名前でよい）<input id="inStoreName" type="text" maxlength="30" autocomplete="off"></label><button type="submit" class="btn primary" id="btnAddStore">この店を追加する</button></form>';
  }
  function cell(k,v,cls,mono){
    return '<div class="cell '+(cls||'')+'"><div class="k">'+k+'</div><div class="v'+(mono?' mono':'')+'">'+v+'</div></div>';
  }
  function routeHtml(s,r){
    var zero=r.taste===0;
    var fav=!!state.favs[favKey(s,r)];
    var gateCls=zero?'gate-ng':'gate-ok';
    var tasteLabel=TASTE[r.taste]+(zero?'（×0）':'');
    var cells=
      cell('味の同じさ',esc(tasteLabel),gateCls,false)+
      cell('列に並ぶ時間',r.wait+'分','',true)+
      cell('知らない人との近さ',NEAR[r.near],'',false)+
      cell('手間',esc(r.effort||'なし'),'',false);
    var ans=zero
      ?'<div class="answer zero">味の同じさが <span class="mono">0</span>。ほかの項目がどうでも、掛け算の答えは <span class="mono">0</span>（その店の味ではない）。</div>'
      :'<div class="answer">味の同じさが <span class="mono">1</span> 以上なので、その店の味には届く。あとは時間・近さ・手間をどう見るか。</div>';
    var del=state.mode==='own'?' <button type="button" class="btn small" data-del="'+esc(r.id)+'" id="del-'+esc(r.id)+'">このルートを消す</button>':'';
    return '<article class="route'+(zero?' zero':'')+'">'+
      '<div class="route-head"><div><h3 class="route-name">'+esc(r.type)+'</h3><p class="route-detail">'+esc(r.detail||'')+'</p></div>'+
      '<button type="button" class="fav" data-fav="'+esc(r.id)+'" id="fav-'+esc(r.id)+'" aria-pressed="'+(fav?'true':'false')+'" aria-label="'+esc(r.type)+'をお気に入りにする">'+(fav?'印あり':'印を付ける')+'</button></div>'+
      '<div class="cells">'+cells+'</div>'+ans+del+'</article>';
  }
  function renderAddRoute(s){
    var typeOpts=TYPES.map(function(t){return '<option value="'+esc(t)+'">'+esc(t)+'</option>';}).join('');
    var nearOpts=NEAR.map(function(t,i){return '<option value="'+i+'">'+t+'</option>';}).join('');
    var tasteOpts=[2,1,0].map(function(i){return '<option value="'+i+'">'+TASTE[i]+'</option>';}).join('');
    return '<h2>ルートを足す</h2><form class="add" id="formRoute">'+
      '<label for="inType">ルートの種類<select id="inType">'+typeOpts+'</select></label>'+
      '<label for="inWait">列に並ぶ時間（分）<input id="inWait" type="number" inputmode="numeric" min="0" max="300" value="0"></label>'+
      '<label for="inNear">知らない人との近さ<select id="inNear">'+nearOpts+'</select></label>'+
      '<label for="inTaste">味の同じさ<select id="inTaste">'+tasteOpts+'</select></label>'+
      '<label for="inEffort">手間（事前に要る行動）<input id="inEffort" type="text" maxlength="30" placeholder="なし" autocomplete="off"></label>'+
      '<button type="submit" class="btn primary" id="btnAddRoute">このルートを追加する</button></form>';
  }
  function renderMain(){
    var el=document.getElementById('main');
    var s=curStore();
    if(!s){el.innerHTML='';return;}
    var q=s.routes.filter(qualifies).length;
    var onlyFront=s.routes.length>0 && s.routes.every(function(r){return r.type==='店頭に並ぶ';});
    var h='';
    h+='<div class="board" role="status"><div class="lab">'+esc(s.name)+'：並ばずに同じ味に行けるルート</div>'+
       '<div><span class="num" id="boardNum">'+q+'</span><span class="unit">本</span></div>'+
       '<div class="def">数えている条件：列に並ぶ時間が10分以下で、味が別物ではない。</div></div>';
    if(onlyFront){
      h+='<div class="honest"><p><b>いまはこの店に並ぶ以外のルートはない。</b></p><p>目的（この店の味）は変えられないので、手段のほうを変えることになる。つまり、行く時間や、列の中での距離の工夫が要る。ここは、ほかのプロダクトの出番。</p></div>';
    }
    h+='<h2>ルートを4つの軸で並べる</h2>';
    h+='<p class="formula"><b>味の同じさ</b> × 列に並ぶ時間 × 知らない人との近さ × 手間。いちばん上の「味の同じさ」が <b>0</b>（別物）なら、目的（その店の味）を満たさないので、ほかが良くても答えは0。</p>';
    if(!s.routes.length){h+='<p class="empty">この店のルートはまだありません。</p>';}
    h+=s.routes.map(function(r){return routeHtml(s,r);}).join('');
    if(state.mode==='own'){h+=renderAddRoute(s);}
    el.innerHTML=h;
  }
  function renderFavs(){
    var el=document.getElementById('favs');
    var items=[];
    stores().forEach(function(s){s.routes.forEach(function(r){if(state.favs[favKey(s,r)]){items.push(s.name+'：'+r.type+'（並ぶ時間 '+r.wait+'分、味は'+TASTE[r.taste]+'）');}});});
    if(!items.length){el.innerHTML='<p class="empty">印を付けたルートがここに並びます。</p>';return;}
    el.innerHTML='<ul>'+items.map(function(t){return '<li>'+esc(t)+'</li>';}).join('')+'</ul>';
  }
  function renderNote(){
    document.getElementById('sampleNote').textContent=state.mode==='sample'
      ?'表示中はサンプルです（店名・時間はすべて架空）。'
      :'自分のデータで使っています。';
  }
  function renderAll(){renderNote();renderStores();renderAddStore();renderMain();renderFavs();}

  function showConfirm(msg,onYes,idPrefix){
    var el=document.getElementById('confirmArea');
    el.innerHTML='<div class="confirm" role="alertdialog" aria-label="確認"><p style="margin:0 0 8px">'+esc(msg)+'</p><div class="row-btns" style="margin:0"><button type="button" class="btn primary small" id="'+idPrefix+'Yes">はい、実行する</button><button type="button" class="btn small" id="'+idPrefix+'No">やめる</button></div></div>';
    document.getElementById(idPrefix+'Yes').addEventListener('click',function(){el.innerHTML='';onYes();});
    document.getElementById(idPrefix+'No').addEventListener('click',function(){el.innerHTML='';});
    document.getElementById(idPrefix+'No').focus();
  }

  function bind(){
    document.getElementById('btnOwn').addEventListener('click',function(){
      showConfirm('サンプルを消して、空の状態から自分で使います。印も消えます。',function(){
        state={mode:'own',sel:'',favs:{},own:[]};save();renderAll();
      },'cfOwn');
    });
    document.getElementById('btnSample').addEventListener('click',function(){
      showConfirm('サンプルに戻します。自分で入れた店とルート、印は消えます。',function(){
        state=fresh();save();renderAll();
      },'cfSample');
    });
    document.getElementById('stores').addEventListener('click',function(e){
      var b=e.target.closest?e.target.closest('[data-store]'):null;
      if(!b)return;
      state.sel=b.getAttribute('data-store');save();renderAll();
      var again=document.getElementById('store-'+state.sel);if(again)again.focus();
    });
    document.getElementById('main').addEventListener('click',function(e){
      var f=e.target.closest?e.target.closest('[data-fav]'):null;
      var d=e.target.closest?e.target.closest('[data-del]'):null;
      var s=curStore();
      if(f&&s){
        var k=s.id+':'+f.getAttribute('data-fav');
        if(state.favs[k])delete state.favs[k];else state.favs[k]=true;
        save();renderMain();renderFavs();
        var again=document.getElementById('fav-'+f.getAttribute('data-fav'));if(again)again.focus();
      }else if(d&&s){
        var rid=d.getAttribute('data-del');
        s.routes=s.routes.filter(function(r){return r.id!==rid;});
        delete state.favs[s.id+':'+rid];
        save();renderAll();
      }
    });
    document.getElementById('main').addEventListener('submit',function(e){
      if(!e.target||e.target.id!=='formRoute')return;
      e.preventDefault();
      var s=curStore();if(!s)return;
      var w=parseInt(document.getElementById('inWait').value,10);if(isNaN(w)||w<0)w=0;
      s.routes.push({id:'u'+Date.now().toString(36)+Math.floor(Math.random()*1000),
        type:document.getElementById('inType').value,wait:w,
        near:parseInt(document.getElementById('inNear').value,10)||0,
        taste:parseInt(document.getElementById('inTaste').value,10),
        effort:document.getElementById('inEffort').value.trim()||'なし',detail:''});
      save();renderAll();
    });
    document.getElementById('addStoreArea').addEventListener('submit',function(e){
      if(!e.target||e.target.id!=='formStore')return;
      e.preventDefault();
      var n=document.getElementById('inStoreName').value.trim();
      if(!n)return;
      var id='u'+Date.now().toString(36);
      state.own.push({id:id,name:n,area:'自分で追加',routes:[{id:'f'+id,type:'店頭に並ぶ',wait:60,near:2,taste:2,effort:'なし',detail:'店頭の列。時間は目安なので、ルート追加で自分の値に近づけられる。'}]});
      state.sel=id;save();renderAll();
    });
  }

  state=load()||fresh();
  if(!state.favs)state.favs={};
  if(!state.own)state.own=[];
  if(state.mode!=='own'&&state.mode!=='sample')state.mode='sample';
  if(!curStore()&&stores().length)state.sel=stores()[0].id;
  bind();
  renderAll();
})();
</script>
</body>
</html>
