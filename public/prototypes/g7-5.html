<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="claude:viewport-fit-sides" content="cover">
<title>ナラビゴコチ</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@500;700&family=Noto+Sans+JP:wght@400;500;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
:root{
  --bg:#F1F3EF; --surface:#FFFFFF; --ink:#1A2320; --muted:#5E6B66; --line:#D9DED9;
  --signal:#E3A008; --signal-ink:#5A3E00; --ok:#2F7D6D; --ng:#C8512F; --board:#1F2A26; --board-ink:#F6C343;
  --font-display:"Zen Kaku Gothic New","Hiragino Sans","Noto Sans JP",sans-serif;
  --font-body:"Noto Sans JP","Hiragino Sans",sans-serif;
  --font-mono:"IBM Plex Mono",ui-monospace,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#111614; --surface:#1A201D; --ink:#E6ECE8; --muted:#9AA7A1; --line:#2C3531;
  --signal:#F2B632; --signal-ink:#2A1D00; --ok:#5FB8A3; --ng:#EE7C5A; --board:#0B0F0D; --board-ink:#F6C343; color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#111614; --surface:#1A201D; --ink:#E6ECE8; --muted:#9AA7A1; --line:#2C3531;
  --signal:#F2B632; --signal-ink:#2A1D00; --ok:#5FB8A3; --ng:#EE7C5A; --board:#0B0F0D; --board-ink:#F6C343; color-scheme:dark;}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);margin:0;font-size:15px;line-height:1.6}
.wrap{max-width:560px;margin:0 auto;padding-top:12px;padding-bottom:56px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.back{display:inline-block;color:var(--muted);font-size:13px;text-decoration:none;padding:4px 0}
.back:hover{text-decoration:underline}
h1{font-family:var(--font-display);font-size:26px;margin:4px 0 10px;letter-spacing:.02em}
h2{font-family:var(--font-display);font-size:17px;margin:0 0 8px}
h3{font-family:var(--font-display);font-size:15px;margin:0 0 6px}
p{margin:0 0 8px}
.note{font-size:12px;color:var(--muted);margin:4px 0}
.hypo{border:1px solid var(--line);border-left:4px solid var(--signal);border-radius:8px;background:var(--surface);padding:8px 12px;margin-bottom:12px;font-size:12.5px}
.hypo dl{margin:0}.hypo dl>div{display:flex;gap:10px;padding:2px 0}
.hypo dt{flex:0 0 5.4em;color:var(--muted);font-weight:500}.hypo dd{margin:0}
.hypo .hit{color:var(--ok)}.hypo .miss{color:var(--ng)}
.samplebar{border:1px dashed var(--line);border-radius:8px;padding:8px 12px;margin-bottom:14px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.btn{font:inherit;font-weight:500;font-size:14px;border:1px solid var(--ink);background:var(--surface);color:var(--ink);border-radius:8px;padding:9px 14px;min-height:44px;cursor:pointer}
.btn:hover{background:var(--bg)}
.btn.primary{background:var(--signal);border-color:var(--signal);color:var(--signal-ink);font-weight:700}
.btn.ghost{border-color:var(--line);color:var(--muted);font-size:12.5px;min-height:38px;padding:6px 10px}
.btn[aria-pressed="true"],.btn.on{background:var(--ink);color:var(--surface)}
.btn:focus-visible,input:focus-visible,select:focus-visible,summary:focus-visible,a:focus-visible{outline:3px solid var(--signal);outline-offset:2px}
.confirm{margin-top:8px;padding:8px 10px;background:var(--bg);border-radius:8px;font-size:13px}
.board{background:var(--board);color:var(--board-ink);border-radius:8px;padding:14px 16px;margin:12px 0}
.board .lab{font-size:12.5px;opacity:.85}
.board .big{font-family:var(--font-mono);font-variant-numeric:tabular-nums;font-weight:600;font-size:40px;line-height:1.15;letter-spacing:.01em}
.board .big small{font-size:16px;margin-left:4px}
.board .sub{font-size:12px;opacity:.8;margin-top:2px}
.board .cols{display:flex;gap:20px;flex-wrap:wrap}
section.blk{border-top:1px solid var(--line);padding:14px 0}
.feel{border-top:1px solid var(--line);padding:14px 0;margin-top:16px}
.mono{font-family:var(--font-mono);font-variant-numeric:tabular-nums}
label{font-size:13px}
input[type=number],input[type=text],select{font:inherit;font-size:14px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink);padding:6px 8px;min-height:40px;max-width:100%}
input[type=range]{width:100%;accent-color:var(--signal)}
.sl{display:grid;grid-template-columns:1fr auto;gap:2px 8px;align-items:center;margin:8px 0}
.sl .v{font-family:var(--font-mono);font-variant-numeric:tabular-nums;font-weight:600}
.sl input{grid-column:1/3}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{text-align:left;padding:5px 4px;border-bottom:1px solid var(--line);font-weight:500}
.tag{display:inline-block;font-size:11px;border:1px solid var(--line);border-radius:6px;padding:0 6px;color:var(--muted)}
.tag.ok{color:var(--ok);border-color:var(--ok)}.tag.ng{color:var(--ng);border-color:var(--ng)}
details{margin:8px 0}summary{cursor:pointer;font-size:13px;color:var(--muted);min-height:32px}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important;scroll-behavior:auto!important}}


.tabs{display:flex;gap:0;margin:0 0 12px;border:1px solid var(--ink);border-radius:8px;overflow:hidden}
.tabs button{flex:1;font:inherit;font-weight:700;font-size:14px;min-height:44px;border:0;background:var(--surface);color:var(--ink);cursor:pointer}
.tabs button[aria-selected="true"]{background:var(--ink);color:var(--surface)}
.tabs button:focus-visible{outline:3px solid var(--signal);outline-offset:-3px}
.receipt{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:14px;text-align:center;font-family:var(--font-mono);font-size:12px;color:var(--muted)}
.receipt svg{width:96px;height:96px;margin:8px auto;display:block}
.receipt svg rect{fill:var(--ink)}
.three{display:grid;gap:8px;margin:12px 0}
.three .btn{text-align:left;min-height:56px;display:flex;flex-direction:column;justify-content:center}
.three .btn b{font-family:var(--font-display);font-size:16px}
.three .btn span{font-size:12px;opacity:.75;font-weight:400}
.thanks{background:var(--bg);border-radius:8px;padding:10px 12px;font-size:14px}
.demo{display:flex;gap:8px;flex-wrap:wrap;align-items:center;font-size:12px;color:var(--muted)}
.heat{display:grid;grid-template-columns:3.4em repeat(7,1fr);gap:3px;font-size:11px}
.heat .h{text-align:center;color:var(--muted);padding:2px 0}
.heat .c{border-radius:4px;text-align:center;padding:5px 0;font-family:var(--font-mono);font-variant-numeric:tabular-nums;background:color-mix(in srgb,var(--ng) calc(var(--r) * 1%),var(--surface));border:1px solid var(--line);color:var(--ink)}
.heat .c small{display:block;font-size:9px;color:var(--muted)}
.heat .c.low{opacity:.45}
.heat .rl{display:flex;align-items:center;font-size:11px;color:var(--muted)}
.cmpr{display:grid;grid-template-columns:4.5em 1fr 1fr;gap:6px 8px;font-size:12.5px;align-items:center}
.cmpr .bar{height:10px;border-radius:5px;background:var(--line);margin:0}
.cmpr .bar i{display:block;height:100%;border-radius:5px;background:var(--ok)}
.cmpr .bar.kyu i{background:var(--ng)}.cmpr .bar.fu i{background:var(--muted)}

</style>
</head>
<body>
<div class="wrap">
<a class="back" href="./">← 50の仮説</a>
<h1>ナラビゴコチ</h1>
<section class="hypo" aria-label="仮説カード">
<dl>
<div><dt>視点</dt><dd>ビジネス・店側 ／ 具体</dd></div>
<div><dt>仮説</dt><dd>客は1タップなら列の居心地を評価する。その声が届けば店は直す。</dd></div>
<div><dt>確かめること</dt><dd><span class="hit">当たり＝食後の1タップなら答える</span><br><span class="miss">外れ＝わざわざ評価しない</span></dd></div>
</dl>
</section>
<div class="samplebar" id="samplebar">
<p id="sampleNote" class="note"></p>
<div class="row"><button type="button" class="btn ghost" id="btnClear">サンプルを消して自分で使う</button><button type="button" class="btn ghost" id="btnReset">サンプルに戻す</button></div>
<div id="confirmBox" class="confirm" hidden><p id="confirmMsg"></p><div class="row"><button type="button" class="btn primary" id="confirmYes">実行する</button><button type="button" class="btn ghost" id="confirmNo">やめる</button></div></div>
</div>

<div class="tabs" role="tablist">
<button type="button" role="tab" id="tabC" aria-selected="true" aria-controls="viewC">客の画面</button>
<button type="button" role="tab" id="tabS" aria-selected="false" aria-controls="viewS">店の画面</button>
</div>
<div id="viewC" role="tabpanel" aria-labelledby="tabC">
<div class="receipt">
<div>レシート（架空）</div>
<svg id="qr" viewBox="0 0 21 21" aria-label="QRコード（見本）" role="img"></svg>
<div>QRを読み取ると、この画面が開きます</div>
</div>
<h2 style="margin-top:14px">今日の列の居心地は？</h2>
<p class="note">1タップで終わります。名前や連絡先は聞きません。</p>
<div class="three" id="three">
<button type="button" class="btn" data-a="0"><b>ゆったり</b><span>前後・横に余裕があった</span></button>
<button type="button" class="btn" data-a="1"><b>ふつう</b><span>気にならなかった</span></button>
<button type="button" class="btn" data-a="2"><b>窮屈</b><span>近さが気になった</span></button>
</div>
<div class="thanks" id="thanks" hidden aria-live="polite"></div>
<details><summary>デモ用: 来店した曜日と時間帯</summary>
<div class="demo"><label for="dDow">曜日</label><select id="dDow"></select><label for="dSlot">時間帯</label><select id="dSlot"></select></div>
</details>
</div>
<div id="viewS" role="tabpanel" aria-labelledby="tabS" hidden>
<div class="board" aria-live="polite">
<div class="cols">
<div><div class="lab">今月「窮屈」と答えた割合</div><div class="big"><span id="bPct">–</span><small>%</small></div></div>
<div><div class="lab">先月との差</div><div class="big"><span id="bDiff">–</span><small>pt</small></div></div>
</div>
<div class="sub" id="bSub"></div>
</div>
<section class="blk">
<h2>曜日 × 時間帯の「窮屈」率（今月）</h2>
<p class="note">色が濃いほど窮屈と答えた人が多い。薄く沈んだマスは回答が5件未満（参考外）。</p>
<div class="heat" id="heat"></div>
<p class="note" id="worst"></p>
</section>
<section class="blk">
<h2>先月と今月</h2>
<div class="cmpr" id="cmpr"></div>
</section>
</div>

<section class="feel" aria-label="触ってみた感想">
<h2>触ってみて、どちらに近い？</h2>
<div class="row"><button type="button" class="btn" id="feelHit">当たりに近い</button><button type="button" class="btn" id="feelMiss">外れに近い</button></div>
<p class="note" id="feelCount"></p>
</section>
</div>
<script>
function $(id){return document.getElementById(id)}
function esc(s){return String(s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function storeKey(){return 'hack3-'+FILE+'-v1'}
function loadState(){try{var s=localStorage.getItem(storeKey());return s?JSON.parse(s):null}catch(e){return null}}
function saveState(o){try{localStorage.setItem(storeKey(),JSON.stringify(o))}catch(e){}}
var G7={st:null,onClear:null,onReset:null,pending:null,rerender:null};
function sampleNoteUpdate(){
  var st=G7.st;
  $('sampleNote').textContent=st.sample?'サンプル表示中（数字はすべて架空）':'自分の入力で使用中（サンプルは消してあります）';
}
function sampleBar(st,onClear,onReset){
  G7.st=st;
  function ask(msg,fn){G7.pending=fn;$('confirmMsg').textContent=msg;$('confirmBox').hidden=false;$('confirmYes').focus()}
  $('btnClear').addEventListener('click',function(){ask('サンプルの数字を消して、空の状態から始めます。',function(){onClear();G7.st.sample=false})});
  $('btnReset').addEventListener('click',function(){ask('今の内容を捨てて、サンプルに戻します。',function(){onReset();G7.st.sample=true})});
  $('confirmNo').addEventListener('click',function(){G7.pending=null;$('confirmBox').hidden=true});
  $('confirmYes').addEventListener('click',function(){
    var f=G7.pending;G7.pending=null;$('confirmBox').hidden=true;
    if(f){f();sampleNoteUpdate();saveState(G7.st);if(G7.rerender)G7.rerender()}
  });
  sampleNoteUpdate();
}
function feelInit(st){
  if(!st.feel)st.feel={hit:0,miss:0};
  function show(){$('feelCount').textContent='この端末での記録: 当たり '+st.feel.hit+' ／ 外れ '+st.feel.miss}
  $('feelHit').addEventListener('click',function(){st.feel.hit++;saveState(st);show()});
  $('feelMiss').addEventListener('click',function(){st.feel.miss++;saveState(st);show()});
  show();
}
function seeded(seed){var s=seed>>>0;return function(){s=(s*1664525+1013904223)>>>0;return s/4294967296}}
function slider(id,label,min,max,step,val,unit){
  return '<div class="sl"><label for="'+id+'">'+label+'</label><span class="v" id="'+id+'V">'+val+unit+'</span><input type="range" id="'+id+'" min="'+min+'" max="'+max+'" step="'+step+'" value="'+val+'"></div>';
}

const FILE='g7-5';

var DOW=['月','火','水','木','金','土','日'],SLOT=['昼 11-14','夕 17-19','夜 19-22'];
function zero(){var o={};for(var d=0;d<7;d++)for(var s=0;s<3;s++)o[d+'-'+s]=[0,0,0];return o}
function gen(seed,shift){
  var r=seeded(seed),o={};
  for(var d=0;d<7;d++)for(var s=0;s<3;s++){
    var base=14+(d>=5?16:0)+(s===0?10:(s===1?4:0))+(d===4&&s===2?10:0)-shift;
    var n=Math.round(8+r()*18+(d>=5?8:0));
    var k=Math.round(n*Math.max(2,base+(r()-0.5)*10)/100),y=Math.round(n*(0.25+r()*0.15));
    k=Math.min(k,n);y=Math.min(y,n-k);o[d+'-'+s]=[y,n-k-y,k];
  }
  return o;
}
function fresh(){return {sample:true,cur:gen(11,4),prev:gen(5,0),answered:false,feel:{hit:0,miss:0}}}
var ST=loadState()||fresh();
var VIEW='C';
function tot(o){var a=[0,0,0];Object.keys(o).forEach(function(k){for(var i=0;i<3;i++)a[i]+=o[k][i]});return a}
function pct(a,i){var n=a[0]+a[1]+a[2];return n?a[i]/n*100:0}
function render(){
  var c=tot(ST.cur),p=tot(ST.prev),nC=c[0]+c[1]+c[2],nP=p[0]+p[1]+p[2];
  $('bPct').textContent=nC?pct(c,2).toFixed(1):'–';
  var diff=nC&&nP?pct(c,2)-pct(p,2):null;
  $('bDiff').textContent=diff===null?'–':(diff>0?'+':'')+diff.toFixed(1);
  $('bSub').textContent='今月の回答 '+nC+'件'+(nP?'（先月 '+nP+'件）':'')+(ST.sample?'　サンプル':'');
  var h='<span></span>'+DOW.map(function(d){return '<span class="h">'+d+'</span>'}).join('');
  var worst=null;
  for(var s=0;s<3;s++){
    h+='<span class="rl">'+SLOT[s]+'</span>';
    for(var d=0;d<7;d++){
      var a=ST.cur[d+'-'+s],n=a[0]+a[1]+a[2],r=n?a[2]/n*100:0;
      h+='<span class="c'+(n<5?' low':'')+'" style="--r:'+Math.round(Math.min(r*1.6,90))+'">'+(n?Math.round(r)+'%':'–')+'<small>'+n+'件</small></span>';
      if(n>=5&&(!worst||r>worst.r))worst={r:r,d:d,s:s,n:n};
    }
  }
  $('heat').innerHTML=h;
  $('worst').textContent=worst?'いちばん窮屈: '+DOW[worst.d]+'曜 '+SLOT[worst.s]+'（'+Math.round(worst.r)+'%、回答 '+worst.n+'件）':'回答が5件以上たまると、ここに出ます。';
  var names=['ゆったり','ふつう','窮屈'],cls=['','fu','kyu'],ch='<span></span><span class="note">先月</span><span class="note">今月</span>';
  [0,1,2].forEach(function(i){
    ch+='<span>'+names[i]+'</span><div><div class="bar '+cls[i]+'"><i style="width:'+pct(p,i)+'%"></i></div><span class="mono">'+(nP?pct(p,i).toFixed(0)+'%':'–')+'</span></div><div><div class="bar '+cls[i]+'"><i style="width:'+pct(c,i)+'%"></i></div><span class="mono">'+(nC?pct(c,i).toFixed(0)+'%':'–')+'</span></div>';
  });
  $('cmpr').innerHTML=ch;
  saveState(ST);
}
function qr(){
  var r=seeded(99),h='';
  function fin(x,y){return (x<7&&y<7)||(x>13&&y<7)||(x<7&&y>13)}
  for(var y=0;y<21;y++)for(var x=0;x<21;x++){
    var on;
    if(fin(x,y)){var lx=x>13?x-14:x,ly=y>13?y-14:y;on=(lx===0||lx===6||ly===0||ly===6||(lx>=2&&lx<=4&&ly>=2&&ly<=4))}
    else on=r()>0.52;
    if(on)h+='<rect x="'+x+'" y="'+y+'" width="1" height="1"/>';
  }
  $('qr').innerHTML=h;
}
function setView(v){
  VIEW=v;$('viewC').hidden=v!=='C';$('viewS').hidden=v!=='S';
  $('tabC').setAttribute('aria-selected',v==='C');$('tabS').setAttribute('aria-selected',v==='S');
}
$('tabC').addEventListener('click',function(){setView('C')});
$('tabS').addEventListener('click',function(){setView('S');render()});
$('dDow').innerHTML=DOW.map(function(d,i){return '<option value="'+i+'">'+d+'</option>'}).join('');
$('dSlot').innerHTML=SLOT.map(function(d,i){return '<option value="'+i+'">'+d+'</option>'}).join('');
var now=new Date(),hr=now.getHours();
$('dDow').value=(now.getDay()+6)%7;$('dSlot').value=hr>=19?2:(hr>=15?1:0);
$('three').addEventListener('click',function(e){
  var b=e.target.closest('button');if(!b)return;
  var a=+b.getAttribute('data-a'),k=$('dDow').value+'-'+$('dSlot').value;
  if(!ST.cur[k])ST.cur[k]=[0,0,0];
  ST.cur[k][a]++;ST.answered=true;
  $('thanks').hidden=false;
  $('thanks').textContent='「'+['ゆったり','ふつう','窮屈'][a]+'」で受け取りました。これで終わりです。店の画面の集計に入りました（'+DOW[$('dDow').value]+'曜 '+SLOT[$('dSlot').value]+'）。';
  render();
});
sampleBar(ST,function(){ST.cur=zero();ST.prev=zero()},function(){var f=ST.feel;Object.assign(ST,fresh());ST.feel=f});
G7.rerender=function(){$('thanks').hidden=true;render()};
qr();feelInit(ST);render();

</script>
</body>
</html>
